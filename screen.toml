title    = "Reel"
rotation = "random"

[params]
theme = "dc"
progress = false
duration = "15s"

[[page]]
path     = "deep-logo.html?color=white"

[[page]]
path     = "life.html"

[[page]]
path     = "wireworld.html"

[[page]]
path     = "flame.html"

[[page]]
path     = "wator.html"
duration = "20s"

[[page]]
path     = "radar.html"
uses     = ["radar", "radar_times", "map", "weather"]

[[page]]
path     = "40c3/clock.html"

[[page]]
path     = "40c3/citizens.html"

[[page]]
path     = "40c3/logos.html"

[[page]]
path     = "40c3/logo-pool.html?racks=1"
duration = "5m"                                # upper limit: ends itself after one rack

[[page]]
path     = "40c3/67.html"
duration = "5s"

[[page]]
path     = "argos.html"

[[page]]
path     = "argustos.html?coordinated=true&done=true&eyes=50&open=20s&random=true&size=0.1&vessels=0.0"

[[page]]
path     = "argustos.html?done=true&open=20s"

[[page]]
path     = "mandelbrot.html"
duration = "20s"

[[page]]
path     = "deep-cyber-38c3.html"

# The owl's reminder: interrupts the rotation every night around midnight.
[[override]]
path = "duolingo.html"
when = { from = "23:53", until = "00:00:30" }   # overnight

# Someone rang: on all screens when triggered, not in the rotation (deepsplay ADR 32).
#   curl -X POST -H "Authorization: Bearer $TOKEN" "http://<host>:4000/c/<config>/interrupts/doorbell?who=Ada"
# The token: the backend's DEEPSPLAY_TOKEN, or the secret named by interrupt_token in the host
# configuration.
[[interrupt]]
name        = "doorbell"
path        = "doorbell.html"
duration    = "10s"
priority    = 10
description = "Someone is at the door"

# Python backend for python.html (backend/, see deepsplay docs/pages.md "Backends").
# Runs only where the host configuration allows it (backend = true).
[backend]
dir     = "backend"
command = ["python", "app.py", "{port}"]
health  = "/health"

# Upstreams for radar.html.
# Radar frames: every URL names a fixed time (and, for forecasts, the DWD run),
# so an answer never changes and can be kept long. XML answers are DWD errors.
[upstream.radar]
url            = "https://maps.dwd.de/geoserver/dwd/wms"
cache_ttl      = "2h"
timeout        = "30s"         # large areas take the DWD several seconds
accepted_types = ["image/png"]
cache_size     = "40MB"

# Available times of the radar layer: the newest DWD run decides which frames
# all screens ask for. Short-lived, refreshed in the background.
[upstream.radar_times]
url            = "https://maps.dwd.de/geoserver/dwd/Niederschlagsradar/wms"
cache_ttl      = "1m"
stale_ttl      = "1h"
refresh        = true
accepted_types = ["text/xml", "application/vnd.ogc.wms_xml"]

# BKG TopPlusOpen map tiles: they do not change, keep them a day.
[upstream.map]
url            = "https://sgx.geodatenzentrum.de/wmts_topplus_open/tile/1.0.0"
cache_ttl      = "24h"
stale_ttl      = "720h"
accepted_types = ["image/png"]
cache_size     = "60MB"

# Bright Sky (JSON API over DWD open data): current weather for radar.html. The DWD
# observations come every 10 to 30 minutes.
[upstream.weather]
url            = "https://api.brightsky.dev"
cache_ttl      = "10m"
stale_ttl      = "6h"
refresh        = true
accepted_types = ["application/json"]
