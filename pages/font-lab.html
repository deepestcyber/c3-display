<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Font Lab</title>
<link rel="stylesheet" href="theme/theme.css">
<script type="application/toml" id="deepsplay-page">
description = "Tool page, not for rotation: the candidate fonts in theme/fonts/, in the colours of the theme."
details     = """
Shows the fonts to choose title, text and number fonts. Scrolls; works with ?theme=.
To see a font on a real page: life.html?font=Orbitron (also font-ui= and font-mono=).
"""
author      = "kratenko"
uses = ["theme"]
</script>
<script src="/lib/v1/deepsplay.js"></script>
<script src="theme/theme.js"></script>
<style>
html, body { overflow: auto; height: auto; min-height: 100%; cursor: auto; font-size: 16px; }
body { background-attachment: fixed; padding: clamp(16px, 3vw, 48px); }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; flex-wrap: wrap; margin-bottom: 24px; }
header h1 { margin: 0; font-family: var(--font-mono); font-size: 18px; font-weight: 400; color: var(--ink-soft); letter-spacing: 0.1em; }
header p { margin: 0; font-family: var(--font-mono); font-size: 13px; color: var(--ink-faint); }
h2 { font-family: var(--font-mono); font-weight: 400; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--accent-soft); margin: 40px 0 12px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 520px), 1fr)); gap: 16px; }
.tile { position: relative; border: 1px solid var(--line); border-radius: 6px; padding: 18px 22px 20px; overflow: hidden;
  background: linear-gradient(160deg, rgba(97, 113, 255, 0.07), transparent 60%); }
.tile .name { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 12px; color: var(--ink-faint); margin-bottom: 14px; }
.tile .name a { color: var(--ink-faint); text-decoration: none; }
.tile .name a:hover { color: var(--accent-soft); }
.tile .k { font-size: 15px; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; color: var(--accent-soft); }
.tile .t { font-size: 54px; line-height: 1.02; font-weight: 700; color: var(--ink); margin: 4px 0 2px; text-shadow: 0 0 0.35em var(--glow); }
.tile .u { font-size: 30px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); }
.tile .b { font-size: 21px; color: var(--ink-soft); margin-top: 10px; line-height: 1.3; }
.tile .n { font-size: 26px; color: var(--ink); margin-top: 10px; font-variant-numeric: tabular-nums; }
.tile .n span { color: var(--accent-soft); }
.tile.mono .t { font-size: 40px; }
.tile .w { display: flex; gap: 18px; margin-top: 10px; font-size: 20px; color: var(--ink-faint); }
</style>
</head>
<body>
<header>
  <h1>FONT LAB · theme <span id="theme"></span></h1>
  <p>Try on a page: life.html?font=&lt;name&gt;&amp;font-ui=&lt;name&gt;&amp;font-mono=&lt;name&gt;</p>
</header>

<h2>Titles and text</h2>
<div class="grid" id="display"></div>

<h2>Numbers and data (monospace)</h2>
<div class="grid" id="mono"></div>

<script>
(() => {
  'use strict'
  const DISPLAY = [
    ['Orbitron', [400, 700, 900]],
    ['Oxanium', [400, 600, 800]],
    ['Exo 2', [300, 500, 800]],
    ['Saira', [300, 500, 800]],
    ['Space Grotesk', [300, 500, 700]],
    ['Teko', [300, 500, 700]],
    ['Big Shoulders Display', [400, 700, 900]],
    ['Rajdhani', [500, 700]],
    ['Chakra Petch', [400, 700]],
    ['Tomorrow', [400, 700]],
    ['Quantico', [400, 700]],
    ['Audiowide', [400]],
    ['Michroma', [400]],
    ['Electrolize', [400]],
  ]
  const MONO = [
    ['JetBrains Mono', [300, 500, 800]],
    ['Space Mono', [400, 700]],
    ['Share Tech Mono', [400]],
    ['VT323', [400]],
  ]

  document.getElementById('theme').textContent = Theme.name

  function tile([family, weights], mono) {
    const el = document.createElement('div')
    el.className = 'tile' + (mono ? ' mono' : '')
    el.style.fontFamily = `"${family}", sans-serif`
    const param = mono ? 'font-mono' : 'font'
    const href = `life.html?${param}=${encodeURIComponent(family)}`
    el.innerHTML = `
      <div class="name"><span>${family} · ${weights.join(' ')}</span><a href="${href}">${href}</a></div>
      <div class="k">Cellular automaton</div>
      <div class="t">${mono ? 'Gen 12,345' : 'Game of Life'}</div>
      <div class="u">deep cyber · 40C3</div>
      <div class="b">Neurons fire, sparks race along the traces. Quick jinx, vexed wizards: 0Oo 1lI</div>
      <div class="n"><span>Gen</span> 12,345 · <span>Pop</span> 4,096 · 23:59:07</div>
      <div class="w">${weights.map(w => `<span style="font-weight:${w}">Aa ${w}</span>`).join('')}</div>`
    return el
  }
  const d = document.getElementById('display'), m = document.getElementById('mono')
  DISPLAY.forEach(f => d.appendChild(tile(f, false)))
  MONO.forEach(f => m.appendChild(tile(f, true)))
})()
</script>
</body>
</html>
