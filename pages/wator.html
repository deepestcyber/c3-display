<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wa-Tor</title>
<link rel="stylesheet" href="theme/theme.css">
<script type="application/toml" id="deepsplay-page">
description = "Wa-Tor, the predator-prey simulation by A. K. Dewdney (1984), over the whole screen."
details     = """
Fish and sharks live on a torus:
- A fish moves to a free neighbouring cell; after fishBreed rounds it leaves a young fish
  behind.
- A shark eats a neighbouring fish or else moves to a free cell; it breeds after
  sharkBreed rounds and starves after starve rounds without fish.

The field adapts to the screen like life.html. Unless given, the parameters are picked at
random from ranges in which neither species died out in tests (220 x 96 cells, 450 rounds).
If one does, the sea is seeded anew.
"""
author      = "kratenko"
credits     = "Wa-Tor by A. K. Dewdney (1984)"
uses = ["theme"]

[params.cells]
type        = "int"
default     = 120
min         = 4
description = "Cells along the shorter side of the screen."

[params.cell]
type        = "int"
min         = 1
description = "Cell size in CSS pixels instead (overrides cells)."

[params.gps]
type        = "number"
default     = 12
min         = 0.1
description = "Rounds per second."

[params.fishBreed]
type        = "int"
min         = 1
description = "Rounds until a fish breeds (default: random 2-5)."

[params.sharkBreed]
type        = "int"
min         = 1
description = "Rounds until a shark breeds (default: random 6-12)."

[params.starve]
type        = "int"
min         = 1
description = "Rounds a shark survives without fish (default: random 2-4)."

[params.fish]
type        = "number"
min         = 0.01
max         = 0.9
description = "Share of cells with fish at the start (default: random 0.15-0.4)."

[params.sharks]
type        = "number"
min         = 0.01
max         = 0.9
description = "Share of cells with sharks at the start (default: random 0.02-0.08)."

[params.render]
type        = "enum"
values      = ["sprites", "paths"]
default     = "sprites"
description = "sprites: fish and sharks drawn from pre-rendered images; paths: each kind as one path (slower)."

[params.glowscale]
type        = "number"
default     = 0.25
min         = 0.01
max         = 1
description = "Resolution of the sharks' glow per axis: 0.25 computes the blur on a quarter width and height and scales it up, which looks the same; 1 is full resolution (slower)."

[params.bench]
type        = "int"
default     = 0
min         = 0
description = "Measure instead of animating: run that many rounds from the start as fast as possible and print the timings on the page."
</script>
<script src="/lib/v1/deepsplay.js"></script>
<script src="theme/theme.js"></script>
</head>
<body>
<div class="stage"><canvas id="c"></canvas></div>

<div class="overlay">
  <div class="caption plate rise">
    <div class="kicker">Predator and prey</div>
    <h1 class="title">Wa-Tor</h1>
    <div class="sub" id="sub">A. K. Dewdney, 1984</div>
  </div>
  <div class="meta plate br rise" style="animation-delay: 250ms">
    <div><span class="label">Round</span><span class="value" id="gen">0</span></div>
    <div><span class="label">Fish</span><span class="value" id="fish">0</span></div>
    <div><span class="label">Sharks</span><span class="value" id="sharks">0</span></div>
  </div>
</div>

<script>
(() => {
  'use strict'

  // parameters left out are picked at random from ranges that keep both species alive
  const P = Deepsplay.params()
  const int = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1))
  const real = (lo, hi) => lo + Math.random() * (hi - lo)
  const CFG = {
    cells: P.cells,
    cell: P.cell || 0,
    gps: P.gps,
    fishBreed: P.fishBreed ?? int(2, 5),
    sharkBreed: P.sharkBreed ?? int(6, 12),
    starve: P.starve ?? int(2, 4),
    fish: P.fish ?? real(0.15, 0.4),
    sharks: P.sharks ?? real(0.02, 0.08),
    bench: P.bench,
    render: P.render,
    glowscale: P.glowscale,
  }

  const canvas = document.getElementById('c')
  const ctx = canvas.getContext('2d')
  const fmt = new Intl.NumberFormat('en-US')
  const el = id => document.getElementById(id)
  el('sub').textContent = `A. K. Dewdney, 1984 · fish breed after ${CFG.fishBreed}, ` +
    `sharks after ${CFG.sharkBreed} rounds · sharks starve after ${CFG.starve}`

  const EMPTY = 0, FISH = 1, SHARK = 2
  let W, H, dpr, cs, cols, rows, n, ox, oy, kind, age, hunger, moved, order, gen, fish, sharks, colors
  const nb = [0, 0, 0, 0], cand = [0, 0, 0, 0]

  // ---------- sea ----------
  function layout() {
    dpr = window.devicePixelRatio || 1
    W = innerWidth; H = innerHeight
    canvas.width = Math.round(W * dpr)
    canvas.height = Math.round(H * dpr)
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0)

    // the sea fills the screen up to the theme's (small) field margin
    const margin = Theme.px('--field-margin')
    const aw = W - 2 * margin, ah = H - 2 * margin
    cs = CFG.cell || Math.max(3, Math.floor(Math.min(aw, ah) / CFG.cells))
    cols = Math.floor(aw / cs)
    rows = Math.floor(ah / cs)
    ox = Math.floor((W - cols * cs) / 2)
    oy = Math.floor((H - rows * cs) / 2)

    n = cols * rows
    kind = new Uint8Array(n); age = new Uint16Array(n); hunger = new Uint16Array(n)
    moved = new Uint32Array(n); order = new Uint32Array(n)
    for (let i = 0; i < n; i++) order[i] = i
    gen = 0
    if (CFG.render === 'sprites') buildSprites()
    seed()
  }

  function seed() {
    for (let i = 0; i < n; i++) {
      const r = Math.random()
      kind[i] = r < CFG.sharks ? SHARK : r < CFG.sharks + CFG.fish ? FISH : EMPTY
      age[i] = Math.floor(Math.random() * (kind[i] === SHARK ? CFG.sharkBreed : CFG.fishBreed))
      hunger[i] = kind[i] === SHARK ? Math.floor(Math.random() * CFG.starve) : 0
      moved[i] = 0
    }
    gen = 0
    count()
  }

  function count() {
    fish = 0; sharks = 0
    for (let i = 0; i < n; i++) if (kind[i] === FISH) fish++; else if (kind[i] === SHARK) sharks++
  }

  // A random one of the four neighbouring cells holding `want`, or -1.
  function pick(i, want) {
    const x = i % cols, y = (i / cols) | 0
    nb[0] = y * cols + (x + 1) % cols; nb[1] = y * cols + (x + cols - 1) % cols
    nb[2] = ((y + 1) % rows) * cols + x; nb[3] = ((y + rows - 1) % rows) * cols + x
    let k = 0
    for (let j = 0; j < 4; j++) if (kind[nb[j]] === want) cand[k++] = nb[j]
    return k ? cand[Math.floor(Math.random() * k)] : -1
  }

  // Move from i to `to`; when breeding, a young one stays behind in i.
  function move(i, to, breed) {
    kind[to] = kind[i]; age[to] = breed ? 0 : age[i]; hunger[to] = hunger[i]; moved[to] = gen
    if (breed) { age[i] = 0; hunger[i] = 0; moved[i] = gen } else kind[i] = EMPTY
  }

  function step() {
    gen++
    // each round in random order, otherwise patterns drift in scan direction
    for (let k = n - 1; k > 0; k--) {
      const j = Math.floor(Math.random() * (k + 1)), t = order[k]; order[k] = order[j]; order[j] = t
    }
    for (let k = 0; k < n; k++) {
      const i = order[k], s = kind[i]
      if (!s || moved[i] === gen) continue
      age[i]++
      let to
      if (s === FISH) {
        to = pick(i, EMPTY)
        if (to >= 0) move(i, to, age[i] >= CFG.fishBreed)
      } else {
        hunger[i]++
        to = pick(i, FISH)
        if (to >= 0) hunger[i] = 0
        else if (hunger[i] > CFG.starve) { kind[i] = EMPTY; continue }
        else to = pick(i, EMPTY)
        if (to >= 0) move(i, to, age[i] >= CFG.sharkBreed)
      }
    }
    count()
    if (!fish || !sharks) seed()
  }

  // ---------- drawing ----------
  // Water is a faint field in the darkest tone, fish are mid blue, sharks the lightest
  // tone with a glow.
  function readColors() {
    const p = Theme.palette()
    const at = i => p[Math.min(i, p.length - 1)]
    colors = { shark: at(0), fish: at(2), water: at(p.length - 1), glow: Theme.color('--glow') }
  }

  function cellPath(want) {
    const path = new Path2D(), s = cs - (cs >= 5 ? 1 : 0), r = cs >= 8 ? Math.max(1, cs * 0.18) : 0
    for (let i = 0; i < n; i++) {
      if (kind[i] !== want) continue
      const x = ox + (i % cols) * cs, y = oy + ((i / cols) | 0) * cs
      if (r) path.roundRect(x, y, s, s, r)
      else path.rect(x, y, s, s)
    }
    return path
  }

  function drawWater() {
    ctx.clearRect(0, 0, W, H)
    ctx.fillStyle = Theme.rgba(colors.water, 0.22)
    ctx.fillRect(ox, oy, cols * cs, rows * cs)
  }
  // Sprites: one pre-rendered image per kind, in device pixels, drawn at whole device pixels.
  let sprites = null
  function buildSprites() {
    const s = cs - (cs >= 5 ? 1 : 0), r = cs >= 8 ? Math.max(1, cs * 0.18) : 0
    const size = Math.ceil(s * dpr)
    const make = fill => {
      const c = document.createElement('canvas')
      c.width = c.height = size
      const g = c.getContext('2d')
      g.setTransform(dpr, 0, 0, dpr, 0, 0)
      g.fillStyle = fill
      g.beginPath()
      if (r) g.roundRect(0, 0, s, s, r)
      else g.rect(0, 0, s, s)
      g.fill()
      return c
    }
    sprites = { [FISH]: make(Theme.rgba(colors.fish, 0.9)), [SHARK]: make(Theme.rgba(colors.shark)) }
  }
  function drawSprites(want) {
    const img = sprites[want]
    ctx.setTransform(1, 0, 0, 1, 0, 0)
    for (let i = 0; i < n; i++) {
      if (kind[i] !== want) continue
      ctx.drawImage(img, Math.round((ox + (i % cols) * cs) * dpr), Math.round((oy + ((i / cols) | 0) * cs) * dpr))
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
  }

  function drawFish() {
    if (CFG.render === 'sprites') return drawSprites(FISH)
    ctx.fillStyle = Theme.rgba(colors.fish, 0.9)
    ctx.fill(cellPath(FISH))
  }

  // Sharks: the lightest tone with a glow. With glowscale < 1 only the shadow is computed on a
  // smaller canvas and scaled up; the sharks themselves are drawn sharp on top.
  let glowCanvas = null
  function drawSharks() {
    const k = CFG.glowscale
    if (k >= 1) {
      ctx.save()
      ctx.shadowColor = Theme.rgba(colors.glow)
      ctx.shadowBlur = cs * 0.9
      ctx.fillStyle = Theme.rgba(colors.shark)
      ctx.fill(cellPath(SHARK))
      ctx.restore()
      return
    }
    const gw = Math.ceil(canvas.width * k), gh = Math.ceil(canvas.height * k)
    if (!glowCanvas) glowCanvas = document.createElement('canvas')
    if (glowCanvas.width !== gw || glowCanvas.height !== gh) { glowCanvas.width = gw; glowCanvas.height = gh }
    const g = glowCanvas.getContext('2d')
    g.setTransform(1, 0, 0, 1, 0, 0)
    g.clearRect(0, 0, gw, gh)
    // shadow only: draw the sharks far off the canvas and offset their shadow back into it
    const off = W + cs * 10
    g.setTransform(dpr * k, 0, 0, dpr * k, -off * dpr * k, 0)
    g.shadowColor = Theme.rgba(colors.glow)
    g.shadowBlur = cs * 0.9 * k
    g.shadowOffsetX = off * dpr * k
    g.fillStyle = '#fff'
    g.fill(cellPath(SHARK))
    ctx.drawImage(glowCanvas, 0, 0, W, H)
    if (CFG.render === 'sprites') return drawSprites(SHARK)
    ctx.fillStyle = Theme.rgba(colors.shark)
    ctx.fill(cellPath(SHARK))
  }

  function draw() {
    drawWater()
    drawFish()
    drawSharks()
    el('gen').textContent = fmt.format(gen)
    el('fish').textContent = fmt.format(fish)
    el('sharks').textContent = fmt.format(sharks)
  }

  // ---------- measuring ----------
  // Reading one pixel forces the canvas to finish all drawing so far, so the time of a part
  // includes the actual painting, not only recording the commands.
  const flush = () => ctx.getImageData(0, 0, 1, 1)
  const stats = list => {
    const a = [...list].sort((x, y) => x - y), avg = a.reduce((s, v) => s + v, 0) / a.length
    return { avg: +avg.toFixed(2), p95: +a[Math.floor(0.95 * (a.length - 1))].toFixed(2), max: +a[a.length - 1].toFixed(2) }
  }
  function bench() {
    const out = { screen: `${W}x${H}@${dpr}`, cell: cs, grid: `${cols}x${rows}`, rounds: CFG.bench }
    const t = { step: [], water: [], fish: [], sharks: [], total: [] }
    const start = { fish: 0, sharks: 0 }
    flush()
    for (let k = 0; k < CFG.bench; k++) {
      const t0 = performance.now(); step(); const t1 = performance.now()
      drawWater(); flush(); const t2 = performance.now()
      drawFish(); flush(); const t3 = performance.now()
      drawSharks(); flush(); const t4 = performance.now()
      t.step.push(t1 - t0); t.water.push(t2 - t1); t.fish.push(t3 - t2); t.sharks.push(t4 - t3); t.total.push(t4 - t0)
      if (!k) { start.fish = fish; start.sharks = sharks }
    }
    for (const k in t) out[k] = stats(t[k])
    out.population = `start ${start.fish} fish, ${start.sharks} sharks; end ${fish} fish, ${sharks} sharks`
    const pre = document.createElement('pre')
    pre.id = 'bench'
    pre.style.cssText = 'position:fixed;left:2vmin;top:2vmin;margin:0;padding:1vmin;background:#000c;color:#fff;font:14px monospace;z-index:9'
    pre.textContent = JSON.stringify(out, null, 1)
    document.body.appendChild(pre)
    console.log('BENCH ' + JSON.stringify(out))
  }

  // ---------- run ----------
  Theme.ready.then(() => {
    readColors()
    layout()
    // the bench waits a moment, so a freshly opened window has its final size
    if (CFG.bench) { setTimeout(() => { layout(); bench() }, 500); return }
    draw()
    addEventListener('resize', () => { layout(); draw() })

    // fixed round rate, independent of the frame rate; at most one round per frame, so a slow
    // round slows the sea down for a moment instead of making it jump ahead
    let last = null, acc = 0
    function frame(t) {
      const dt = 1000 / CFG.gps
      if (last !== null) acc = Math.min(acc + t - last, dt)
      last = t
      if (acc >= dt) { step(); acc -= dt; draw() }
      requestAnimationFrame(frame)
    }
    requestAnimationFrame(frame)
  })
})()
</script>
</body>
</html>
