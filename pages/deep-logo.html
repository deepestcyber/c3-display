<title>Deep Cyber</title>
<!--
  Animated deep cyber logo. Self-contained, scales to any viewport.

  Sparks enter at the pin holes (left and top) and run along the traces and synapses.
  A spark that reaches a pin hole leaves the logo. A spark that reaches a letter or a
  neuron charges it; at its threshold the node fires a spark on each of its connections.

  URL parameters, for trying things out:
    color=random     every spark gets its own random bright colour (default)
    color=inherit    sparks enter with random bright colours, nodes mix the colours
                     they receive and fire in their mixed colour
    color=palette    random pick from a small neon palette
    color=white      all sparks white
    color=200        fixed hue in degrees (0-360)
    rate=3           sparks per second entering at the pins
    speed=120        spark speed in logo units per second (the logo is ~310 units wide)
    threshold=5      charge a node needs before it fires; each spark adds 1. Without leak a
                     fraction rounds up (4.5 fires on the 5th spark); with leak, timing
                     decides (4.5 fires on the 5th spark if they come fast, else on the 6th)
    spread=1         random variation of the threshold per node, uniform +-spread
                     (int or float, 0 for none); thresholds never go below 1
    leak=0           charge a node loses per second (default 0: no leak)
    trail=16         trail length in logo units
    fill=1           show the charge as a fill rising from the bottom of letters and
                     neurons (default 0: off)
    halo=1           show the charge as a halo that grows brighter (default 0: off;
                     with both off, letters and neurons only flash when they fire)
    glow=mix         letters and neurons glow in the mixed colour of the sparks they
                     received (default: white)
    debug            draw the graph on top
-->
<style>
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; cursor: none; }
#logo, #fx { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
#logo { overflow: visible; }
#fx { pointer-events: none; }
</style>

    ["p", "t5", [292.54, 144.31, 293.19, 146.27, 296.53, 146.27, 304.53, 122.27, 304.53, 116.27, 299.19, 100.27, 248.53, 100.28, 248.54, 76.28]],
    ["p", "r", [260.17, 145.2, 260.53, 146.27, 289.19, 146.27, 293.19, 158.27, 316.53, 158.27]],
    ["c", "y", [72.53, 164.69, 72.53, 162.27, 112.53, 162.27, 113.86, 158.27, 145.86, 158.27, 147.19, 162.27, 156.53, 162.27, 156.53, 164.69]],
    ["c", "y", [110.11, 168.27, 114.53, 168.27, 116.53, 162.27, 122.53, 162.27, 123.33, 164.68]],
    ["y", "b", [159.51, 187.27, 163.03, 187.27, 169.53, 167.28, 172.99, 167.28]],

    ["e3", "r", [265.73, 164.68, 266.53, 162.27, 278.53, 162.27, 280.53, 168.29, 280.52, 170.27, 277.86, 178.27, 277.86, 182.27, 277.99, 182.47]],
    ["r", "t6", [322.67, 164.7, 319.19, 154.27, 301.86, 154.27, 300.53, 150.27, 300.53, 146.27, 308.53, 122.27, 308.53, 116.27, 301.86, 96.27, 260.52, 96.27, 260.51, 76.28]],
    ["c", "n0", [65.54, 195.21, 84.16, 222.09]],
    ["c", "n1", [97.94, 195.21, 137.09, 225.88]],
    ["y", "n0", [119.57, 195.21, 104.0, 221.38]],
    ["y", "n1", [146.2, 206.7, 148.37, 219.1]],
    ["y", "n2", [153.81, 205.18, 192.59, 227.89]],
    ["b", "n1", [184.24, 195.21, 162.8, 222.73]],
    ["b", "n2", [197.31, 195.21, 203.76, 219.48]],
    ["e3", "n2", [231.03, 195.21, 217.11, 221.09]],
    ["e3", "n3", [247.76, 195.2, 258.29, 220.29]],
    ["r", "n2", [276.05, 195.11, 224.01, 227.51]],
    ["r", "n3", [319.9, 178.1, 277.81, 223.73]],
    ["n0", "n4", [102.57, 253.62, 114.59, 278.42]],
    ["n0", "n5", [109.71, 247.46, 164.39, 284.65]],
    ["n0", "n6", [111.52, 244.07, 219.48, 288.03]],

    ["n1", "n5", [159.49, 253.6, 171.51, 278.39]],
    ["n1", "n6", [166.62, 247.44, 221.28, 284.62]],
    ["n2", "n4", [193.29, 247.39, 137.8, 284.72]],
    ["n2", "n5", [200.28, 253.52, 187.72, 278.6]],
    ["n2", "n6", [216.43, 253.6, 228.49, 278.5]],
    ["n3", "n4", [248.39, 244.06, 139.52, 288.1]],
    ["n3", "n5", [250.2, 247.4, 194.71, 284.74]],
    ["n3", "n6", [257.21, 253.52, 244.66, 278.58]]
  ]
}

<script>
(() => {
  'use strict'

  // ---------- configuration ----------
  const P = new URLSearchParams(location.search)
  const num = (k, d) => { const v = parseFloat(P.get(k)); return Number.isFinite(v) ? v : d }
  const CFG = {
    color: P.get('color') || 'random',
    glow: P.get('glow') || 'white',
    rate: num('rate', 3),
    speed: num('speed', 120),
    threshold: num('threshold', 5),
    spread: num('spread', 1),
    leak: num('leak', 0),
    trail: num('trail', 16),
    fill: num('fill', 0) > 0,
    halo: num('halo', 0) > 0,
    maxSparks: 250,
    debug: P.has('debug'),
  }

  // ---------- colours ----------
  function hsl(h, s, l) {
    const k = n => (n + h / 30) % 12
    const a = s * Math.min(l, 1 - l)
    const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1))
    return [f(0) * 255, f(8) * 255, f(4) * 255]
  }
  const PALETTE = [[0, 229, 255], [255, 43, 214], [125, 255, 58], [255, 176, 0], [255, 255, 255], [150, 100, 255]]
  const pick = a => a[Math.floor(Math.random() * a.length)]
  const brightRandom = () => hsl(Math.random() * 360, 1, 0.55 + Math.random() * 0.15)
  const fixedHue = parseFloat(CFG.color)

  function newColor() {
    if (Number.isFinite(fixedHue)) return hsl(fixedHue, 1, 0.6)
    if (CFG.color === 'white') return [255, 255, 255]
    if (CFG.color === 'palette') return pick(PALETTE)
    return brightRandom()
  }
  function firedColor(node) {
    return CFG.color === 'inherit' ? node.color.slice() : newColor()
  }
  // Mix a colour into a node's colour, weighted by the charge it already holds, and keep it bright.
  function mixColor(c, add, weight) {
    const m = c.map((v, i) => (v * weight + add[i]) / (weight + 1))
    const max = Math.max(...m, 1)
    return m.map(v => v * 255 / max)
  }
  const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`

  // ---------- graph ----------
  const svg = document.getElementById('logo')
  const canvas = document.getElementById('fx')
  const ctx = canvas.getContext('2d')
  const G = JSON.parse(document.getElementById('graph').textContent)

  const nodes = {}
  for (const [id, n] of Object.entries(G.nodes)) {
    nodes[id] = {
      id, kind: n.kind, x: n.x, y: n.y, el: n.el ? document.getElementById(n.el) : null,
      edges: [], charge: 0, level: 0, flash: 0, refractory: 0,
      threshold: Math.max(1, CFG.threshold + (Math.random() * 2 - 1) * CFG.spread),
      color: newColor(), tintDirty: true,
    }
  }
  const edges = G.edges.map(([a, b, pts]) => {
    const cum = [0]
    for (let i = 2; i < pts.length; i += 2) {
      cum.push(cum[cum.length - 1] + Math.hypot(pts[i] - pts[i - 2], pts[i + 1] - pts[i - 1]))
    }
    const e = { a: nodes[a], b: nodes[b], pts, cum, len: cum[cum.length - 1] }
    e.a.edges.push(e)
    e.b.edges.push(e)
    return e
  })
  const pins = Object.values(nodes).filter(n => n.kind === 'pin')
  const cells = Object.values(nodes).filter(n => n.kind !== 'pin')

  // Point at distance s from the edge's first point.
  function pointAt(e, s) {
    const { pts, cum } = e
    s = Math.max(0, Math.min(e.len, s))
    let i = 1
    while (i < cum.length - 1 && cum[i] < s) i++
    const t = (s - cum[i - 1]) / ((cum[i] - cum[i - 1]) || 1)
    return [pts[2 * i - 2] + (pts[2 * i] - pts[2 * i - 2]) * t, pts[2 * i - 1] + (pts[2 * i + 1] - pts[2 * i - 1]) * t]
  }
  // Points of the edge between distances s0 < s1, corners included.
  function slice(e, s0, s1) {
    const out = [pointAt(e, s0)]
    for (let i = 1; i < e.cum.length - 1; i++) {
      if (e.cum[i] > s0 && e.cum[i] < s1) out.push([e.pts[2 * i], e.pts[2 * i + 1]])
    }
    out.push(pointAt(e, s1))
    return out
  }

  // ---------- sparks ----------
  // d: distance the head has travelled from the start node; the edge is walked forward
  // (from e.a) or backward (from e.b).
  let sparks = []
  let particles = []
  let bursts = []
  let pending = []
  let now = 0

  function launch(from, e, color, delay = 0) {
    pending.push({ t: now + delay, from, e, color })
  }
  function startSpark(p) {
    if (sparks.length >= CFG.maxSparks) return
    sparks.push({
      e: p.e, fwd: p.e.a === p.from, d: 0, arrived: false,
      speed: CFG.speed * (0.8 + Math.random() * 0.4),
      color: p.color, phase: Math.random() * 100, sparkle: 0,
    })
    if (p.from.kind === 'pin') bursts.push({ x: p.from.x, y: p.from.y, t: 0, life: 0.35, color: p.color, out: false })
  }
  const edgePos = (s, d) => s.fwd ? d : s.e.len - d

  function arrive(s) {
    const node = s.fwd ? s.e.b : s.e.a
    if (node.kind === 'pin') {
      bursts.push({ x: node.x, y: node.y, t: 0, life: 0.7, color: s.color, out: true })
      return
    }
    node.flash = Math.max(node.flash, 0.3)
    if (node.refractory > 0) return
    node.color = mixColor(node.color, s.color, Math.max(node.charge, 0.5))
    node.tintDirty = true
    node.charge += 1
    if (node.charge >= node.threshold) fire(node)
  }

  function fire(node) {
    node.charge = 0
    node.flash = 1
    node.refractory = 0.3
    // fire on all connections, the incoming one included
    for (const e of node.edges) launch(node, e, firedColor(node), 0.08 + Math.random() * 0.15)
  }

  // ---------- view: map viewBox units to device pixels ----------
  let dpr = 1, view = { a: 1, e: 0, f: 0 }, unit = 1
  const headCache = new Map()

  function resize() {
    dpr = window.devicePixelRatio || 1
    canvas.width = Math.round(innerWidth * dpr)
    canvas.height = Math.round(innerHeight * dpr)
    const m = svg.getScreenCTM()
    view = { a: m.a * dpr, e: m.e * dpr, f: m.f * dpr }
    unit = view.a
    headCache.clear()
    for (const n of cells) buildSprites(n)
  }

  // Shape of a letter or neuron as Path2D in viewBox units, and its box.
  function nodeShape(n) {
    const toView = svg.getScreenCTM().inverse().multiply(n.el.getScreenCTM())
    const local = new Path2D()
    if (n.kind === 'neuron') {
      const r = parseFloat(n.el.getAttribute('r')) + 0.6
      local.arc(parseFloat(n.el.getAttribute('cx')), parseFloat(n.el.getAttribute('cy')), r, 0, Math.PI * 2)
    } else {
      local.addPath(new Path2D(n.el.getAttribute('d')))
    }
    const shape = new Path2D()
    shape.addPath(local, toView)
    const b = n.el.getBBox()
    const xs = [], ys = []
    for (const [x, y] of [[b.x, b.y], [b.x + b.width, b.y], [b.x, b.y + b.height], [b.x + b.width, b.y + b.height]]) {
      const p = new DOMPoint(x, y).matrixTransform(toView)
      xs.push(p.x); ys.push(p.y)
    }
    const box = { x: Math.min(...xs), y: Math.min(...ys) }
    box.w = Math.max(...xs) - box.x
    box.h = Math.max(...ys) - box.y
    return { shape, box }
  }

  // Alpha masks of the shape (fill) and of its blurred halo, in device pixels.
  function buildSprites(n) {
    const { shape, box } = nodeShape(n)
    const pad = 9
    const w = Math.ceil((box.w + 2 * pad) * unit), h = Math.ceil((box.h + 2 * pad) * unit)
    const mk = () => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c }
    const fill = mk(), halo = mk()
    let c = fill.getContext('2d')
    c.setTransform(unit, 0, 0, unit, (pad - box.x) * unit, (pad - box.y) * unit)
    c.fillStyle = '#fff'
    c.fill(shape)
    // halo: draw the shape far off-canvas and keep only its shadow
    c = halo.getContext('2d')
    const off = 10000
    c.shadowColor = '#fff'
    c.shadowBlur = 4 * unit
    c.shadowOffsetX = off * unit
    c.setTransform(unit, 0, 0, unit, (pad - box.x - off) * unit, (pad - box.y) * unit)
    c.fillStyle = '#fff'
    c.fill(shape)
    c.shadowBlur = 1.5 * unit
    c.fill(shape)
    n.box = box
    n.pad = pad
    n.mask = { fill, halo }
    n.tint = { fill: mk(), halo: mk() }
    n.tintDirty = true
  }

  function retint(n) {
    for (const k of ['fill', 'halo']) {
      const c = n.tint[k].getContext('2d')
      c.globalCompositeOperation = 'copy'
      c.drawImage(n.mask[k], 0, 0)
      c.globalCompositeOperation = 'source-in'
      c.fillStyle = CFG.glow === 'mix' ? rgba(n.color, 1) : '#fff'
      c.fillRect(0, 0, n.tint[k].width, n.tint[k].height)
    }
    n.tintDirty = false
  }

  // Glowing head of a spark, cached per (quantized) colour.
  function headSprite(color) {
    const key = (color[0] >> 4) << 8 | (color[1] >> 4) << 4 | (color[2] >> 4)
    let s = headCache.get(key)
    if (s) return s
    const R = Math.max(8, Math.ceil(7 * unit))
    s = document.createElement('canvas')
    s.width = s.height = 2 * R
    const c = s.getContext('2d')
    const g = c.createRadialGradient(R, R, 0, R, R, R)
    g.addColorStop(0, 'rgba(255,255,255,1)')
    g.addColorStop(0.12, 'rgba(255,255,255,0.95)')
    g.addColorStop(0.22, rgba(color, 0.8))
    g.addColorStop(0.5, rgba(color, 0.22))
    g.addColorStop(1, rgba(color, 0))
    c.fillStyle = g
    c.fillRect(0, 0, 2 * R, 2 * R)
    headCache.set(key, s)
    return s
  }

  // ---------- simulation ----------
  let spawnIn = 0

  function step(dt) {
    now += dt

    spawnIn -= dt
    while (spawnIn <= 0) {
      spawnIn += -Math.log(1 - Math.random()) / CFG.rate
      const pin = pick(pins)
      launch(pin, pin.edges[0], newColor())
    }

    const due = pending.filter(p => p.t <= now)
    if (due.length) {
      pending = pending.filter(p => p.t > now)
      due.forEach(startSpark)
    }

    for (const s of sparks) {
      s.d += s.speed * dt
      if (!s.arrived && s.d >= s.e.len) { s.arrived = true; arrive(s) }
      s.sparkle += dt * 10
      while (s.sparkle >= 1 && !s.arrived) {
        s.sparkle -= 1
        const [x, y] = pointAt(s.e, edgePos(s, s.d))
        const a = Math.random() * Math.PI * 2, v = 4 + Math.random() * 10
        particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, life: 0.25 + Math.random() * 0.4, color: s.color })
      }
    }
    sparks = sparks.filter(s => s.d - CFG.trail < s.e.len)

    for (const p of particles) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94 }
    particles = particles.filter(p => p.t < p.life)
    if (particles.length > 800) particles.splice(0, particles.length - 800)
    for (const b of bursts) b.t += dt
    bursts = bursts.filter(b => b.t < b.life)

    for (const n of cells) {
      n.charge = Math.max(0, n.charge - CFG.leak * dt)
      n.refractory = Math.max(0, n.refractory - dt)
      n.flash = Math.max(0, n.flash - dt * 2.2)
      const target = n.charge / n.threshold
      n.level += (target - n.level) * Math.min(1, dt * 6)
    }
  }

  // ---------- drawing ----------
  function drawCell(n) {
    if (n.level < 0.01 && n.flash < 0.01) return
    if (n.tintDirty) retint(n)
    const { box, pad } = n
    const W = box.w + 2 * pad, H = box.h + 2 * pad
    const sw = n.tint.fill.width, sh = n.tint.fill.height
    // charge fills the shape from the bottom
    const f = Math.min(1, n.level)
    if (CFG.fill && f > 0.01) {
      const top = box.y + box.h * (1 - f)
      const sy = (top - box.y + pad) / H * sh
      ctx.globalCompositeOperation = 'source-over'
      ctx.globalAlpha = n.kind === 'neuron' ? 0.55 : 0.45
      ctx.drawImage(n.tint.fill, 0, sy, sw, sh - sy, box.x - pad, top, W, box.y + box.h + pad - top)
    }
    ctx.globalCompositeOperation = 'lighter'
    ctx.globalAlpha = Math.min(1, (CFG.halo ? 0.55 * f : 0) + 0.9 * n.flash)
    ctx.drawImage(n.tint.halo, box.x - pad, box.y - pad, W, H)
    if (n.flash > 0.01) {
      ctx.globalAlpha = 0.7 * n.flash
      ctx.drawImage(n.tint.fill, box.x - pad, box.y - pad, W, H)
    }
    ctx.globalAlpha = 1
  }

  function drawSpark(s, t) {
    const head = Math.min(s.d, s.e.len), tail = Math.max(0, s.d - CFG.trail)
    if (head <= tail) return
    const fade = s.arrived ? Math.max(0, 1 - (s.d - s.e.len) / CFG.trail) : 1
    const flicker = 0.8 + 0.2 * Math.sin(t * 31 + s.phase) * Math.sin(t * 17 + s.phase * 1.7)
    let pts = slice(s.e, s.fwd ? tail : s.e.len - head, s.fwd ? head : s.e.len - tail)
    if (!s.fwd) pts = pts.reverse()
    const [tx, ty] = pts[0], [hx, hy] = pts[pts.length - 1]
    const g = ctx.createLinearGradient(tx, ty, hx, hy)
    g.addColorStop(0, rgba(s.color, 0))
    g.addColorStop(1, rgba(s.color, 0.55 * fade))
    ctx.beginPath()
    ctx.moveTo(tx, ty)
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1])
    ctx.strokeStyle = g
    ctx.lineWidth = 3.2
    ctx.stroke()
    const g2 = ctx.createLinearGradient(tx, ty, hx, hy)
    g2.addColorStop(0, rgba(s.color, 0))
    g2.addColorStop(0.7, rgba(s.color, 0.8 * fade))
    g2.addColorStop(1, `rgba(255,255,255,${fade})`)
    ctx.strokeStyle = g2
    ctx.lineWidth = 1.1
    ctx.stroke()
    if (!s.arrived) {
      const img = headSprite(s.color)
      const r = 7 * flicker
      ctx.globalAlpha = flicker
      ctx.drawImage(img, hx - r, hy - r, 2 * r, 2 * r)
      ctx.globalAlpha = 1
    }
  }

  function draw(t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0)
    ctx.clearRect(0, 0, canvas.width, canvas.height)
    ctx.setTransform(view.a, 0, 0, view.a, view.e, view.f)
    ctx.lineCap = 'round'
    ctx.lineJoin = 'round'

    for (const n of cells) drawCell(n)

    ctx.globalCompositeOperation = 'lighter'
    for (const b of bursts) {
      const k = b.t / b.life
      if (b.out) {
        ctx.beginPath()
        ctx.arc(b.x, b.y, 3 + 9 * k, 0, Math.PI * 2)
        ctx.strokeStyle = rgba(b.color, 0.8 * (1 - k))
        ctx.lineWidth = 1.2 * (1 - k) + 0.2
        ctx.stroke()
      }
      const img = headSprite(b.color)
      const r = (b.out ? 9 : 6) * (1 - k * 0.5)
      ctx.globalAlpha = (1 - k) * (b.out ? 0.9 : 0.6)
      ctx.drawImage(img, b.x - r, b.y - r, 2 * r, 2 * r)
      ctx.globalAlpha = 1
    }
    for (const s of sparks) drawSpark(s, t)
    for (const p of particles) {
      const a = 1 - p.t / p.life
      ctx.fillStyle = rgba(p.color, a)
      const r = 0.25 + 0.35 * a
      ctx.fillRect(p.x - r, p.y - r, 2 * r, 2 * r)
    }
    ctx.globalCompositeOperation = 'source-over'

    if (CFG.debug) drawDebug()
  }

  function drawDebug() {
    ctx.lineWidth = 0.4
    ctx.font = '4px monospace'
    edges.forEach((e, i) => {
      ctx.strokeStyle = `hsl(${i * 47 % 360},100%,60%)`
      ctx.beginPath()
      ctx.moveTo(e.pts[0], e.pts[1])
      for (let j = 2; j < e.pts.length; j += 2) ctx.lineTo(e.pts[j], e.pts[j + 1])
      ctx.stroke()
    })
    ctx.fillStyle = '#ff0'
    for (const n of Object.values(nodes)) {
      const x = n.box ? n.box.x : n.x, y = n.box ? n.box.y : n.y
      ctx.fillText(n.kind === 'pin' ? n.id : `${n.id} ${n.charge.toFixed(1)}/${n.threshold.toFixed(1)}`, x, y)
    }
  }

  // ---------- start ----------
  resize()
  addEventListener('resize', resize)
  // start with some charge, so the network wakes up quickly
  for (const n of cells) n.charge = Math.random() * (n.threshold - 1)
  for (let i = 0; i < 6; i++) { const pin = pick(pins); launch(pin, pin.edges[0], newColor(), Math.random()) }

  let last = performance.now()
  function frame(ms) {
    const dt = Math.min(0.05, (ms - last) / 1000)
    last = ms
    step(dt)
    draw(ms / 1000)
    requestAnimationFrame(frame)
  }
  requestAnimationFrame(frame)
})()
</script>
