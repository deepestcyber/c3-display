<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Reel</title>
<meta name="author" content="Peer Springstübe">
<!-- Zusaetzliche Seite fuers Office Board (config "pages"). Feste Groesse 1920 x 1080, das Board skaliert sie.
     Zeigt bei jedem Laden eine zufaellige Animation mit einer zufaelligen Welt.
     Zum Testen: reel.html?anim=wireworld&world=2 (Index in der Weltenliste), reel.html?anim=life (oder wator, mandelbrot, julia, newton, ship, ifs, flame, lsystem).
     reload=30 laedt die Seite alle 30 s neu (wie F5, mit denselben Parametern), wie im Wechsel am Board. -->
<style>
@font-face { font-family: "Inter"; font-style: normal; font-weight: 100 900; font-display: block;
  src: url("../assets/fonts/inter-latin-wght-normal.woff2") format("woff2"); }

:root {
  --bg: #06101a;
  --line: #16324a;
  --ink: #e6f1f8;
  --soft: #a9c3d6;
  --green: #00ff5c;
  --blue: #0081b2;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg);
  color: var(--ink); font-family: "Inter", sans-serif; cursor: none; }

canvas { position: absolute; left: 0; top: 0; }

.top { position: absolute; left: 110px; right: 110px; top: 64px; display: flex; align-items: flex-end; justify-content: space-between; }
.kicker { font-size: 24px; font-weight: 700; letter-spacing: 0.22em; color: var(--soft); }
h1 { margin: 4px 0 0; font-size: 84px; line-height: 1; font-weight: 900; letter-spacing: -0.04em; }
.sub { font-size: 30px; font-weight: 500; color: var(--soft); margin-top: 10px; }
.sub b { color: var(--ink); font-weight: 700; }

.legend { display: flex; gap: 40px; font-size: 26px; font-weight: 600; color: var(--soft); padding-bottom: 8px; }
.legend span { display: flex; align-items: center; gap: 14px; }
.legend b { min-width: 6ch; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.legend i { width: 24px; height: 24px; border-radius: 5px; background: var(--c); box-shadow: 0 0 14px var(--g, transparent); }

.in { opacity: 0; transform: translateY(24px); animation: rise 900ms var(--ease-out) forwards; }
@keyframes rise { to { opacity: 1; transform: none; } }
#c { opacity: 0; animation: fade 1200ms ease 300ms forwards; }
@keyframes fade { to { opacity: 1; } }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>

<div class="top">
  <div class="in">
    <div class="kicker" id="kicker"></div>
    <h1 id="title"></h1>
    <div class="sub" id="sub"></div>
  </div>
  <div class="legend in" id="legend" style="animation-delay: 300ms"></div>
</div>

  function wireworld(ctx, world) {

    var ox = AREA.x + Math.floor((AREA.w - w * cs) / 2), oy = AREA.y + Math.floor((AREA.h - h * cs) / 2);
    var gap = cs >= 6 ? 1 : 0, r = cs >= 10 ? Math.round(cs * 0.2) : 0;

    // Nur Nicht-Leer-Zellen rechnen; Nachbarn vorab als Liste (CSR).

  // ---------- Game of Life ----------
  // Standardregeln B3/S23 auf einem Torus, Startwelt zufaellig mit Dichte density.

  var LIFE_WORLDS = [

  function gameOfLife(ctx, world) {
    var cs = world.cs, w = Math.floor(AREA.w / cs), h = Math.floor(AREA.h / cs);
    var ox = AREA.x + Math.floor((AREA.w - w * cs) / 2), oy = AREA.y + Math.floor((AREA.h - h * cs) / 2);
    var alive = new Uint8Array(w * h), next = new Uint8Array(w * h), born = new Uint8Array(w * h);
    var dead = new Uint8Array(w * h); // Generationen seit dem Tod, 0 = nie gelebt oder ausgeglommen
    for (var i = 0; i < alive.length; i++) alive[i] = Math.random() < world.density ? 1 : 0;

    function step() {
      for (var y = 0; y < h; y++) {
        var up = ((y + h - 1) % h) * w, row = y * w, down = ((y + 1) % h) * w;
        for (var x = 0; x < w; x++) {
          var l = (x + w - 1) % w, r = (x + 1) % w;
          var n = alive[up + l] + alive[up + x] + alive[up + r] + alive[row + l] + alive[row + r] +
                  alive[down + l] + alive[down + x] + alive[down + r];
          var i = row + x, was = alive[i], is = n === 3 || (was && n === 2) ? 1 : 0;
          next[i] = is;
          born[i] = is && !was ? 1 : 0;
          if (is) dead[i] = 0;
          else if (was) dead[i] = 1;
          else if (dead[i]) dead[i] = dead[i] >= world.fade ? 0 : dead[i] + 1;
        }
      }
      var t = alive; alive = next; next = t;
    }

    function rect(i) {
      ctx.beginPath();
      ctx.roundRect(ox + (i % w) * cs, oy + ((i / w) | 0) * cs, cs - 1, cs - 1, 2);
      ctx.fill();
    }

    function draw() {
      ctx.clearRect(0, 0, 1920, 1080);
      var i;
      for (var a = 1; a <= world.fade; a++) {
        ctx.fillStyle = 'rgba(0, 129, 178, ' + (0.55 * (1 - (a - 1) / world.fade)).toFixed(3) + ')';
        for (i = 0; i < dead.length; i++) if (dead[i] === a) rect(i);
      }
      ctx.fillStyle = '#00c94a';
      for (i = 0; i < alive.length; i++) if (alive[i] && !born[i]) rect(i);
      ctx.fillStyle = '#c9ffdc';
      for (i = 0; i < alive.length; i++) if (born[i]) rect(i);
    }

    return { gps: world.gps, step: step, draw: draw };
  }

  // ---------- Wa-Tor ----------
  // Raeuber-Beute-Simulation nach A. K. Dewdney (1984): Fische und Haie auf einem Torus.
  // Fisch: zieht auf ein freies Nachbarfeld, nach fishBreed Runden laesst er dabei einen Fisch zurueck.
  // Hai: frisst einen benachbarten Fisch oder zieht auf ein freies Feld, vermehrt sich nach sharkBreed
  // Runden und verhungert nach starve Runden ohne Fisch. Parameter und Startwelt zufaellig in den
  // Bereichen unten; darin starb in Tests (220 x 96, 450 Runden) keine Art aus. Falls doch: neu aussaeen.
  var WATOR_WORLDS = [
    { name: '', cs: 8, gps: 12,
      fishBreed: [2, 5], sharkBreed: [6, 12], starve: [2, 4], fish: [0.15, 0.4], sharks: [0.02, 0.08] }
  ];

  function wator(ctx, world) {
    function int(r) { return r[0] + Math.floor(Math.random() * (r[1] - r[0] + 1)); }
    function real(r) { return r[0] + Math.random() * (r[1] - r[0]); }
    var p = { fishBreed: int(world.fishBreed), sharkBreed: int(world.sharkBreed), starve: int(world.starve),
              fish: real(world.fish), sharks: real(world.sharks) };
    world.by = 'Nachwuchs: Fisch ' + p.fishBreed + ', Hai ' + p.sharkBreed + ' Runden · Hai verhungert nach ' + p.starve;

    var cs = world.cs, w = Math.floor(AREA.w / cs), h = Math.floor(AREA.h / cs), n = w * h;
    var ox = AREA.x + Math.floor((AREA.w - w * cs) / 2), oy = AREA.y + Math.floor((AREA.h - h * cs) / 2);
    var kind = new Uint8Array(n); // 0 Wasser, 1 Fisch, 2 Hai
    var age = new Uint16Array(n), hunger = new Uint16Array(n), moved = new Uint32Array(n), gen = 0;
    var order = new Uint32Array(n), nb = [0, 0, 0, 0], cand = [0, 0, 0, 0], i;
    for (i = 0; i < n; i++) order[i] = i;

    function seed() {
      for (var i = 0; i < n; i++) {
        var r = Math.random();
        kind[i] = r < p.sharks ? 2 : r < p.sharks + p.fish ? 1 : 0;
        age[i] = Math.floor(Math.random() * (kind[i] === 2 ? p.sharkBreed : p.fishBreed));
        hunger[i] = kind[i] === 2 ? Math.floor(Math.random() * p.starve) : 0;
      }
    }
    seed();

    // Zufaelliges Nachbarfeld (von vier) mit der gesuchten Art, sonst -1.
    function pick(i, want) {

      nb[2] = ((y + 1) % h) * w + x; nb[3] = ((y + h - 1) % h) * w + x;
      for (var j = 0; j < 4; j++) if (kind[nb[j]] === want) cand[k++] = nb[j];
      return k ? cand[Math.floor(Math.random() * k)] : -1;
    }

    // Zieht von i nach to; mit breed bleibt in i ein Junges zurueck.
    function move(i, to, breed) {
      kind[to] = kind[i]; age[to] = breed ? 0 : age[i]; hunger[to] = hunger[i]; moved[to] = gen;
      if (breed) { age[i] = 0; hunger[i] = 0; moved[i] = gen; } else kind[i] = 0;
    }

    function step() {
      gen++;
      // Jede Runde in zufaelliger Reihenfolge, sonst wandern Muster in Scanrichtung.
      for (var k = n - 1; k > 0; k--) {
        var j = Math.floor(Math.random() * (k + 1)), t = order[k]; order[k] = order[j]; order[j] = t;

          if (to >= 0) move(i, to, age[i] >= p.fishBreed);
        } else {
          hunger[i]++;
          to = pick(i, 1);
          if (to >= 0) hunger[i] = 0;
          else if (hunger[i] > p.starve) { kind[i] = 0; continue; }
          else to = pick(i, 0);
          if (to >= 0) move(i, to, age[i] >= p.sharkBreed);

      }
      count();
      if (!fish || !sharks) { seed(); count(); }
    }

    var fish = 0, sharks = 0;
    function count() {
      fish = 0; sharks = 0;
      for (var i = 0; i < n; i++) if (kind[i] === 1) fish++; else if (kind[i] === 2) sharks++;
    }
    count();

    function draw() {
      ctx.clearRect(0, 0, 1920, 1080);
      var i;
      ctx.fillStyle = '#0a2236';
      ctx.fillRect(ox, oy, w * cs, h * cs);
      ctx.fillStyle = '#33a9d9';
      for (i = 0; i < n; i++) if (kind[i] === 1) ctx.fillRect(ox + (i % w) * cs, oy + ((i / w) | 0) * cs, cs - 1, cs - 1);
      ctx.fillStyle = '#ff0539';
      for (i = 0; i < n; i++) if (kind[i] === 2) ctx.fillRect(ox + (i % w) * cs, oy + ((i / w) | 0) * cs, cs - 1, cs - 1);
    }

    return { gps: world.gps, step: step, draw: draw, counts: function () { return [fish, sharks]; } };
  }

  // ---------- Fraktal-Zoom (Mandelbrot, Julia, Burning Ship) ----------
  // Startet beim ganzen Fraktal, sucht im aktuellen Bild eine Stelle mit viel Struktur (Rand der Menge),

  function fractalWorld(o) {
    var w = { name: '', scale: 2, hold: 2500, highlight: 2200, zoom: 3000, zoomBy: [4, 8] };
    for (var k in o) w[k] = o[k];

  }

    [[20, 0, 40], [140, 20, 140], [255, 90, 110], [255, 220, 150], [40, 10, 60]],
    [[0, 0, 0], [120, 20, 0], [255, 120, 0], [255, 240, 160], [30, 0, 0]]
  ];

  function fractalZoom(ctx, world) {
    var S = world.scale, W = Math.floor(AREA.w / S), H = Math.floor(AREA.h / S);
    var ox = AREA.x + Math.floor((AREA.w - W * S) / 2), oy = AREA.y + Math.floor((AREA.h - H * S) / 2);
    var home = world.home, kind = world.kind, jr = 0, ji = 0;
    if (kind === 'julia') {
      var jc = world.cs[Math.floor(Math.random() * world.cs.length)];

    var LUT_N = 1024, lut = new Uint8Array(LUT_N * 3);
    var stops = MANDELBROT_PALETTES[Math.floor(Math.random() * MANDELBROT_PALETTES.length)];

      for (var c = 0; c < 3; c++) lut[i * 3 + c] = Math.round(a[c] + (b[c] - a[c]) * u);

      var cctx = canvas.getContext('2d');
      return { view: view, canvas: canvas, cctx: cctx, img: cctx.createImageData(W, H), vals: new Float32Array(W * H),

    // Rechnet Zeilen, bis das Zeitbudget verbraucht ist; true, wenn das Bild fertig ist.

      var d = j.img.data, M = j.maxIter, from = j.row;
      while (j.row < H && performance.now() - t0 < budget) {

        for (var x = 0; x < W; x++) {

          } else {
            while (n < M && zr2 + zi2 < 256) { zi = 2 * zr * zi + cy; zr = zr2 - zi2 + cr; zr2 = zr * zr; zi2 = zi * zi; n++; }

    // Zufaellige Ausschnitte bewerten: viele Wechsel der Iterationszahl = Rand der Menge = Struktur.
    // Ganz in der Menge (schwarz) oder weit draussen (glatte Baender) gibt wenig Punkte, ebenso

        t.x = (f[0] - home.x) / px + W / 2 - t.w / 2;

      for (var c = 0; c < 250; c++) {

  // ---------- Chaosspiel: IFS (Farn & Co.) und fraktale Flammen ----------
  // Ein Punkt springt zufaellig zwischen einigen Abbildungen hin und her; wo er oft landet, wird es hell.

  var IFS_WORLDS = [
    { name: 'Barnsley-Farn', maps: [[0, 0, 0, 0.16, 0, 0, 0.01], [0.85, 0.04, -0.04, 0.85, 0, 1.6, 0.85],

    { name: 'Ahornblatt', maps: [[0.14, 0.01, 0, 0.51, -0.08, -1.31, 0.1], [0.43, 0.52, -0.45, 0.5, 1.49, -0.75, 0.35],

  var FLAME_WORLDS = [{ name: 'Zufällige Flamme', kind: 'flame' }];

  // Leuchtende Verlaeufe fuer Dichtebilder (dunkle Toene gingen in der Dichte unter).
  var GLOW_PALETTES = [
    [[255, 90, 30], [255, 200, 60], [255, 255, 200], [80, 170, 255], [150, 60, 255]],

    horseshoe: function (x, y, r2, r) { return [(x - y) * (x + y) / r, 2 * x * y / r]; },

    heart: function (x, y, r2, r, th) { return [r * Math.sin(th * r), -r * Math.cos(th * r)]; },
    disc: function (x, y, r2, r, th) { return [th / Math.PI * Math.sin(Math.PI * r), th / Math.PI * Math.cos(Math.PI * r)]; },

    var maps, label;
    function ifsMaps() {

    function flameMaps() {

      var n = 2 + Math.floor(rnd() * 3), used = {}, list = [];
      for (var i = 0; i < n; i++) {

    var bw2 = box.x1 - box.x0, bh2 = box.y1 - box.y0, scale = Math.min(AREA.w / bw2, AREA.h / bh2) * 0.96;

    var cnt = new Float32Array(Wd * Hd), col = new Float32Array(Wd * Hd), maxCnt = 1, points = 0;
    var img = ctx.createImageData(Wd, Hd), data = img.data;

    function plot(budget, limit) {

      while (n < limit) {

          step();

          var y = Math.floor(Hd - 1 - ((py - box.y0) * scale + (Hd - bh2 * scale) / 2));

          var k = y * Wd + x;
          cnt[k]++; col[k] += pc;
          if (cnt[k] > maxCnt) maxCnt = cnt[k];
        }
        if (performance.now() - t0 > budget) break;
      }
      points += n;
    }

    // Dichte -> Farbe: log-Skala, Gamma 2,2; Farbe = mittlere Farbkoordinate der Treffer.
    function tone() {
      var lm = Math.log(1 + maxCnt);
      for (var k = 0; k < cnt.length; k++) {
        var n = cnt[k];
        if (!n) { data[k * 4 + 3] = 0; continue; }
        var v = Math.pow(Math.log(1 + n) / lm, 1 / 2.2), li = Math.min(LUT_N - 1, Math.floor(col[k] / n * (LUT_N - 1))) * 3;
        data[k * 4] = lut[li] * v; data[k * 4 + 1] = lut[li + 1] * v; data[k * 4 + 2] = lut[li + 2] * v; data[k * 4 + 3] = 255;
      }
      ctx.clearRect(0, 0, 1920, 1080);
      ctx.putImageData(img, dx, dy);
    }

    // Punktzahl nach Zeit, damit man das Entstehen sieht: Chaosspiel 1 Mio. nach 10 s (danach aendert
    // sich kaum noch etwas), Flamme 2 Mio. nach 4 s, 14 Mio. nach 10 s. Hoechstens 10 ms Rechnen pro Bild.
    var start = null, lastTone = 0;
    function frame(t) {
      if (start === null) start = t;
      var s = (t - start) / 1000, goal = world.kind === 'ifs' ? 1e6 * Math.pow(s / 10, 3) : 1.4e5 * s * s;
      plot(10, Math.max(0, Math.floor(goal - points)));
      if (t - lastTone > (s < 2 ? 0 : 100)) { tone(); lastTone = t; }
    }

    function status() {
      return label + ' · ' + (points >= 1e6 ? (points / 1e6).toLocaleString('de-DE', { maximumFractionDigits: 1 }) + ' Mio.' :
             points >= 1e4 ? Math.round(points / 1000).toLocaleString('de-DE') + ' Tsd.' : points.toLocaleString('de-DE')) + ' Punkte';
    }

    return { draw: function () {}, frame: frame, status: status };
  }

  // ---------- Lindenmayer-System ----------
  // Ersetzungsregeln wachsen zu einer langen Zeichenkette, eine Schildkroete zeichnet sie: F (und draw) =
  // vorwaerts mit Strich, + / - = drehen, [ / ] = Position merken / zurueck. Pflanzen wachsen von innen nach
  // aussen (nach Verzweigungstiefe sortiert), mit etwas Zufall in Winkel und Laenge; Kurven werden der
  // Reihe nach gezeichnet. Zeiten in ms: grow = bis alles gezeichnet ist.
  var LSYSTEM_WORLDS = [
    { name: 'Pflanze', axiom: 'X', rules: { X: 'F+[[X]-X]-F[-FX]+X', F: 'FF' }, angle: 25, n: 6, plant: true },
    { name: 'Busch', axiom: 'F', rules: { F: 'FF+[+F-F-F]-[-F+F+F]' }, angle: 22.5, n: 4, plant: true },
    { name: 'Baum', axiom: 'X', rules: { X: 'F[+X][-X]FX', F: 'FF' }, angle: 25.7, n: 7, plant: true },
    { name: 'Zweig', axiom: 'X', rules: { X: 'F-[[X]+X]+F[+FX]-X', F: 'FF' }, angle: 22.5, n: 5, plant: true },
    { name: 'Koch-Schneeflocke', axiom: 'F++F++F', rules: { F: 'F-F++F-F' }, angle: 60, n: 4 },
    { name: 'Hilbert-Kurve', axiom: 'A', rules: { A: '+BF-AFA-FB+', B: '-AF+BFB+FA-' }, angle: 90, n: 6 },
    { name: 'Drachenkurve', axiom: 'FX', rules: { X: 'X+YF+', Y: '-FX-Y' }, angle: 90, n: 12 },
    { name: 'Sierpinski-Pfeilspitze', axiom: 'A', rules: { A: 'B-A-B', B: 'A+B+A' }, angle: 60, n: 7, draw: 'AB' },
    { name: 'Gosper-Kurve', axiom: 'A', rules: { A: 'A-B--B+A++AA+B-', B: '+A-BB--B-A++A+B' }, angle: 60, n: 4, draw: 'AB' }
  ];
  LSYSTEM_WORLDS.forEach(function (w) { w.grow = w.plant ? 18000 : 15000; });

  function lsystem(ctx, world) {
    var str = world.axiom, i;
    for (var g = 0; g < world.n; g++) {
      var next = [];
      for (i = 0; i < str.length; i++) next.push(world.rules[str[i]] || str[i]);
      str = next.join('');
    }
    world.by = world.n + ' Generationen · Winkel ' + String(world.angle).replace('.', ',') + '°';

    // Schildkroete: Strecken mit Verzweigungstiefe sammeln. Pflanzen wachsen nach oben und wackeln etwas.
    var draws = 'F' + (world.draw || ''), jitter = world.plant ? 0.12 : 0, mirror = world.plant && Math.random() < 0.5 ? -1 : 1;
    var x = 0, y = 0, dir = world.plant ? -Math.PI / 2 : 0, depth = 0, stack = [], segs = [], maxDepth = 0;
    var turn = world.angle * Math.PI / 180 * mirror;
    for (i = 0; i < str.length; i++) {
      var ch = str[i];
      if (draws.indexOf(ch) >= 0) {
        var len = 1 + (Math.random() - 0.5) * jitter;
        var nx = x + Math.cos(dir) * len, ny = y + Math.sin(dir) * len;
        segs.push([x, y, nx, ny, depth]);
        x = nx; y = ny;
      } else if (ch === '+') dir += turn * (1 + (Math.random() - 0.5) * jitter * 2);
      else if (ch === '-') dir -= turn * (1 + (Math.random() - 0.5) * jitter * 2);
      else if (ch === '[') { stack.push([x, y, dir]); depth++; if (depth > maxDepth) maxDepth = depth; }
      else if (ch === ']') { var st = stack.pop(); x = st[0]; y = st[1]; dir = st[2]; depth--; }
    }
    if (world.plant) segs = segs.map(function (s, i) { return [s, i]; })
      .sort(function (a, b) { return a[0][4] - b[0][4] || a[1] - b[1]; }).map(function (s) { return s[0]; });

    var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    segs.forEach(function (s) {
      x0 = Math.min(x0, s[0], s[2]); x1 = Math.max(x1, s[0], s[2]);
      y0 = Math.min(y0, s[1], s[3]); y1 = Math.max(y1, s[1], s[3]);
    });
    var scale = Math.min(AREA.w / (x1 - x0), AREA.h / (y1 - y0)) * 0.94;
    var ox = AREA.x + (AREA.w - (x1 - x0) * scale) / 2 - x0 * scale, oy = AREA.y + (AREA.h - (y1 - y0) * scale) / 2 - y0 * scale;

    var stops = GLOW_PALETTES[Math.floor(Math.random() * GLOW_PALETTES.length)];
    function along(u) { // Farbverlauf entlang der Kurve
      var f = u * (stops.length - 1), a = stops[Math.floor(f)], b = stops[Math.min(stops.length - 1, Math.floor(f) + 1)], v = f % 1;
      return 'rgb(' + [0, 1, 2].map(function (c) { return Math.round(a[c] + (b[c] - a[c]) * v); }).join(',') + ')';
    }
    function plantColor(d) { // Stamm braun, aussen gruen
      var u = maxDepth ? d / maxDepth : 0, a = [138, 90, 43], b = [0, 255, 92];
      return 'rgb(' + [0, 1, 2].map(function (c) { return Math.round(a[c] + (b[c] - a[c]) * Math.pow(u, 0.7)); }).join(',') + ')';
    }

    var drawn = 0, start = null;
    ctx.lineCap = 'round';
    function frame(t) {
      if (start === null) { start = t; ctx.clearRect(0, 0, 1920, 1080); }
      var upTo = Math.min(segs.length, Math.ceil(segs.length * Math.min(1, (t - start) / world.grow)));
      for (; drawn < upTo; drawn++) {
        var s = segs[drawn];
        ctx.strokeStyle = world.plant ? plantColor(s[4]) : along(drawn / segs.length);
        ctx.lineWidth = world.plant ? Math.max(1, Math.min(6, scale * 0.6) * (1 - s[4] / (maxDepth + 1))) : Math.max(1.5, Math.min(4, scale * 0.25));
        ctx.beginPath();
        ctx.moveTo(ox + s[0] * scale, oy + s[1] * scale);
        ctx.lineTo(ox + s[2] * scale, oy + s[3] * scale);
        ctx.stroke();
      }
    }

    return { draw: function () {}, frame: frame };
  }

  // ---------- Animationen ----------
  // Neue Animation (z. B. Game of Life): Eintrag mit worlds und start(ctx, world) -> {gps, step, draw}.
  // Optional counts() -> Zahlen, die hinter den ersten Legendeneintraegen stehen.
  var ANIMATIONS = [
    {
      id: 'wireworld',
      kicker: 'ZELLULÄRER AUTOMAT',
      title: 'Wireworld',
      legend: [
        { label: 'Elektronenkopf', color: '#c9ffdc', glow: 'rgba(0, 255, 92, 0.8)' },
        { label: 'Schweif', color: '#0081b2' },
        { label: 'Leiter', color: '#4a3a17' }
      ],
      worlds: WIREWORLD_WORLDS,
      start: wireworld
    },
    {
      id: 'life',
      kicker: 'ZELLULÄRER AUTOMAT',
      title: 'Game of Life',
      legend: [
        { label: 'Geboren', color: '#c9ffdc' },
        { label: 'Lebend', color: '#00c94a' },
        { label: 'Gestorben', color: 'rgba(0, 129, 178, 0.55)' }
      ],
      worlds: LIFE_WORLDS,
      start: gameOfLife
    },
    {
      id: 'wator',
      kicker: 'RÄUBER UND BEUTE',
      title: 'Wa-Tor',
      legend: [
        { label: 'Fisch', color: '#33a9d9' },
        { label: 'Hai', color: '#ff0539' },
        { label: 'Wasser', color: '#0a2236' }
      ],
      worlds: WATOR_WORLDS,
      start: wator
    },
    {
      id: 'mandelbrot',
      kicker: 'FRAKTAL',
      title: 'Mandelbrot-Menge',
      legend: [],
      worlds: MANDELBROT_WORLDS,
      start: fractalZoom
    },
    {
      id: 'julia',
      kicker: 'FRAKTAL',
      title: 'Julia-Menge',
      legend: [],
      worlds: JULIA_WORLDS,
      start: fractalZoom
    },
    {
      id: 'newton',
      kicker: 'FRAKTAL',
      title: 'Newton-Fraktal',
      legend: [],
      worlds: NEWTON_WORLDS,
      start: fractalZoom
    },
    {
      id: 'ifs',
      kicker: 'FRAKTAL',
      title: 'Chaosspiel',
      legend: [],
      worlds: IFS_WORLDS,
      start: chaosGame
    },
    {
      id: 'flame',
      kicker: 'FRAKTAL',
      title: 'Fraktale Flamme',
      legend: [],
      worlds: FLAME_WORLDS,
      start: chaosGame
    },
    {
      id: 'lsystem',
      kicker: 'FRAKTAL',
      title: 'Lindenmayer-System',
      legend: [],
      worlds: LSYSTEM_WORLDS,
      start: lsystem
    },
    // Burning Ship vorerst raus: Zoomziele oft flach oder verrauscht.
    // {
    //   id: 'ship',
    //   kicker: 'FRAKTAL',
    //   title: 'Burning Ship',
    //   legend: [],
    //   worlds: SHIP_WORLDS,
    //   start: fractalZoom
    // }
  ];

  function pick(list, key) {
    var m = new RegExp('[?&]' + key + '=([^&]*)').exec(location.search);
    if (m) {
      var v = decodeURIComponent(m[1]);
      for (var i = 0; i < list.length; i++) if (list[i].id === v || String(i) === v) return list[i];
    }
    return list[Math.floor(Math.random() * list.length)];
  }

  var reload = /[?&]reload=([\d.]+)/.exec(location.search);
  if (reload && +reload[1] > 0) setTimeout(function () { location.reload(); }, reload[1] * 1000);

  var anim = pick(ANIMATIONS, 'anim');
  var world = pick(anim.worlds, 'world');

  // Zuerst starten: Animationen mit zufaelligen Parametern tragen sie dabei in world.by ein.
  var ctx = document.getElementById('c').getContext('2d');
  var sim = anim.start(ctx, world);
  sim.draw();

  document.getElementById('kicker').textContent = anim.kicker;
  document.getElementById('title').textContent = anim.title;
  var sub = document.getElementById('sub');
  var sep = world.name ? ' · ' : '';
  if (world.name) sub.appendChild(document.createElement('b')).textContent = world.name;
  var byText = sub.appendChild(document.createTextNode(sep + world.by));
  var legend = document.getElementById('legend'), countText = [];
  anim.legend.forEach(function (l, k) {
    var s = legend.appendChild(document.createElement('span')), i = s.appendChild(document.createElement('i'));
    i.style.setProperty('--c', l.color);
    if (l.glow) i.style.setProperty('--g', l.glow);
    s.appendChild(document.createTextNode(l.label));
    if (sim.counts && k < sim.counts().length) countText.push(s.appendChild(document.createElement('b')).appendChild(document.createTextNode('')));
  });

  // Automaten: feste Generationsrate, unabhaengig von der Bildrate; nach Haengern nicht aufholen.
  // Animationen mit eigenem Ablauf (sim.frame) steuern sich selbst; sim.status ersetzt die Unterzeile.
  var last = null, acc = 0;
  function frame(t) {
    if (sim.frame) sim.frame(t);
    else {
      if (last !== null) acc += Math.min(t - last, 250);
      last = t;
      var dt = 1000 / sim.gps, n = 0;
      while (acc >= dt) { sim.step(); acc -= dt; n++; }
      if (n) sim.draw();
    }
    if (sim.status) {
      var s = sep + sim.status();
      if (byText.data !== s) byText.data = s;
    }
    if (sim.counts) sim.counts().forEach(function (c, k) {
      var s = c.toLocaleString('de-DE');
      if (countText[k].data !== s) countText[k].data = s;
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
