<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wireworld</title>
<link rel="stylesheet" href="theme/theme.css">
<script type="application/toml" id="deepsplay-page">
description = "Wireworld (Brian Silverman, 1987): electrons running through circuits."
details     = """
Cells are empty, conductor, electron head or electron tail. A head becomes a tail, a tail
becomes conductor, and conductor becomes a head when one or two of its eight neighbours are
heads. With that, wires carry signals and diodes and gates can be built.

The circuits are fixed patterns from the Golly pattern collection (Patterns/WireWorld),
scaled to fill the screen without running under the text.
"""
author      = "kratenko"
credits     = "Wireworld by Brian Silverman (1987); circuits from the Golly pattern collection"
uses = ["theme"]

[params.world]
type        = "int"
min         = 0
max         = 4
description = "Index of the circuit (0-4); default: random."

[params.cycle]
type        = "number"
default     = 60
min         = 0
description = "Seconds per circuit, then the next one (random); 0 keeps the first."

[params.speed]
type        = "number"
default     = 1
min         = 0.1
description = "Factor on the circuit's own generations per second."

[[variants]]
label = "Turing machine"
query = "world=4&cycle=0"
</script>
<script src="/lib/v1/deepsplay.js"></script>
<script src="theme/theme.js"></script>
<style>
  #c { transition: opacity 1200ms ease; }
  #c.out { opacity: 0; }
</style>
</head>
<body>
<div class="stage"><canvas id="c"></canvas></div>

<div class="overlay">

      "C.C.C.C.C.C.C.C$4.A3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C$" +
      "$$$$.C2.3C4.3C7.C$C.C2.C6.C3.2C2.C.C$3C2.C6.C7.C.C$C.C2.C6.C3.2C2.C.C$C.C2.C6.C8.C$$$6.C3.C3.C3.C3.C7.C3.C3.C3" +
      ".C$2.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C$6.C3.C3" +
      ".C3.C3.C7.C3.C3.C3.C$$$.C2.3C4.3C7.C2.3C.C3.2C2.C3.3C6.2C2.2C2.3C2.C3.C2.3C.3C.3C$C.C2.C6.C3.2C3.C2.C.C.C5.C.C" +
      "3.C.C2.2C4.C3.C.C.C3.C.C3.C3.C.C3.C$3C2.C6.C8.C2.3C.3C2.C2.3C.C.C7.C3.C2.C.C4.C4.3C.C.C3.C$C.C2.C6.C3.2C3.C4.C" +
      "2.C2.C4.C2.C.C2.2C4.C.C3.C.C3.C.C3.C.C.C.C3.C$C.C2.C6.C7.3C.3C2.C2.3C2.C2.3C6.2C2.3C.3C2.C3.C2.3C.3C3.C$$$6.C3" +
      ".C3.C3.C3.C7.C3.C3.C3.C7.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C$2.C3.C3.C3.C3.C3.C3.C3.C3." +
      "C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C$6.C3.C3.C3.C3.C7.C3.C3.C3.C7.C3.C3.C" +
      "3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C3.C" },
  ]

  const P = Deepsplay.params()
  const CFG = {
    world: P.world === undefined ? null : P.world % WORLDS.length,
    cycle: P.cycle,
    speed: P.speed,
  }

  const canvas = document.getElementById('c')
  const ctx = canvas.getContext('2d')
  const fmt = new Intl.NumberFormat('en-US')
  const el = id => document.getElementById(id)

  function parseRle(world) {
    const cells = new Uint8Array(world.w * world.h)
    let x = 0, y = 0, n = ''
    for (const ch of world.rle) {
      if (ch >= '0' && ch <= '9') { n += ch; continue }
      const k = n ? parseInt(n, 10) : 1
      n = ''
      if (ch === '$') { y += k; x = 0; continue }
      const v = '.ABC'.indexOf(ch)
      for (let j = 0; j < k; j++, x++) cells[y * world.w + x] = v
    }
    return cells
  }

  // ---------- one circuit ----------
  let world, w, h, cells, next, live, nbStart, nb, gen, heads
  let W, H, dpr, cs, ox, oy, bg, colors

  function load(index) {
    world = WORLDS[index]
    w = world.w; h = world.h
    cells = parseRle(world)
    next = new Uint8Array(cells.length)
    // only non-empty cells take part; their neighbours as a list (CSR)
    live = []; nbStart = [0]; nb = []
    for (let i = 0; i < cells.length; i++) {
      if (!cells[i]) continue
      const cx = i % w, cy = (i / w) | 0
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue
        const nx = cx + dx, ny = cy + dy
        if (nx >= 0 && ny >= 0 && nx < w && ny < h && cells[ny * w + nx]) nb.push(ny * w + nx)
      }
      live.push(i); nbStart.push(nb.length)
    }
    gen = 0
    count()
    el('sub').textContent = `${world.name} · ${world.by}`
    layout()
  }

  function step() {
    for (let k = 0; k < live.length; k++) {
      const i = live[k], v = cells[i]
      if (v === 1) next[i] = 2
      else if (v === 2) next[i] = 3
      else {
        let hs = 0
        for (let j = nbStart[k]; j < nbStart[k + 1]; j++) if (cells[nb[j]] === 1) hs++
        next[i] = hs === 1 || hs === 2 ? 1 : 3
      }
    }
    const t = cells; cells = next; next = t
    gen++
    count()
  }

  function count() {
    heads = 0
    for (const i of live) if (cells[i] === 1) heads++
  }

  // ---------- drawing ----------
  // Conductors in the darkest tone (drawn once), tails in the accent, heads in the lightest
  // tone with a glow.
  function readColors() {
    const p = Theme.palette()
    colors = { wire: p[p.length - 1], tail: Theme.color('--accent'), head: p[0], glow: Theme.color('--glow') }
  }

  // The circuit fills the screen up to the field margin; cells at most 1/24 of the shorter side.
  // It must not run under the text plates: if it would, it is moved up, and if that is not
  // enough, shrunk until it fits.
  function layout() {
    dpr = window.devicePixelRatio || 1
    W = innerWidth; H = innerHeight
    canvas.width = Math.round(W * dpr)
    canvas.height = Math.round(H * dpr)
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
    const margin = Theme.px('--field-margin')
    const aw = W - 2 * margin, ah = H - 2 * margin
    const gap = Theme.px('--margin') / 2
    const plates = [...document.querySelectorAll('.overlay .plate')].map(e => {
      const r = e.getBoundingClientRect()
      return { x0: r.left - gap, y0: r.top - gap, x1: r.right + gap, y1: r.bottom + gap }
    })
    const hits = (size, x0, y0) => {
      for (const i of live) {
        const x = x0 + (i % w) * size, y = y0 + ((i / w) | 0) * size
        for (const p of plates) if (x < p.x1 && x + size > p.x0 && y < p.y1 && y + size > p.y0) return true
      }
      return false
    }
    let size = Math.max(2, Math.min(Math.floor(Math.min(aw, ah) / 24), Math.floor(Math.min(aw / w, ah / h))))
    for (; ; size--) {
      const x0 = Math.floor((W - w * size) / 2)
      const centred = Math.floor((H - h * size) / 2), top = Math.ceil(margin)
      const y0 = !hits(size, x0, centred) ? centred : !hits(size, x0, top) ? top : null
      if (y0 !== null || size <= 2) { cs = size; ox = x0; oy = y0 ?? centred; break }
    }

    // conductors once into a background image
    bg = document.createElement('canvas')
    bg.width = canvas.width; bg.height = canvas.height
    const b = bg.getContext('2d')
    b.setTransform(dpr, 0, 0, dpr, 0, 0)
    b.fillStyle = Theme.rgba(colors.wire)
    b.fill(cellPath(() => true))
  }

  function cellPath(test, pad = 0) {
    const path = new Path2D(), s = cs - (cs >= 6 ? 1 : 0), r = cs >= 10 ? Math.round(cs * 0.2) : 0
    for (const i of live) {
      if (!test(i)) continue
      const x = ox + (i % w) * cs - pad, y = oy + ((i / w) | 0) * cs - pad
      if (r) path.roundRect(x, y, s + 2 * pad, s + 2 * pad, r + pad)
      else path.rect(x, y, s + 2 * pad, s + 2 * pad)
    }
    return path
  }

  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0)
    ctx.clearRect(0, 0, canvas.width, canvas.height)
    ctx.drawImage(bg, 0, 0)
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
    ctx.fillStyle = Theme.rgba(colors.tail)
    ctx.fill(cellPath(i => cells[i] === 2))
    // heads: a soft halo (a larger, transparent cell), then the head itself
    if (cs >= 4) {
      ctx.fillStyle = Theme.rgba(colors.glow, 0.35)
      ctx.fill(cellPath(i => cells[i] === 1, Math.max(1, Math.round(cs * 0.35))))
    }
    ctx.fillStyle = Theme.rgba(colors.head)
    ctx.fill(cellPath(i => cells[i] === 1))
    el('gen').textContent = fmt.format(gen)
    el('heads').textContent = fmt.format(heads)
  }

  // ---------- run ----------
  const pickWorld = () => {
    if (WORLDS.length < 2) return 0
    let k
    do k = Math.floor(Math.random() * WORLDS.length); while (world && WORLDS[k] === world)
    return k
  }

  Theme.ready.then(() => {
    readColors()
    load(CFG.world ?? pickWorld())
    draw()
    addEventListener('resize', () => { layout(); draw() })

    // fixed generation rate per circuit, independent of the frame rate; no catching up after a stall
    let last = null, acc = 0, started = performance.now(), fading = false
    function frame(t) {
      if (last !== null) acc += Math.min(t - last, 250)
      last = t
      if (!fading) {
        const dt = 1000 / (world.gps * CFG.speed)
        let stepped = false
        while (acc >= dt) { step(); acc -= dt; stepped = true }
        if (stepped) draw()
        if (CFG.cycle > 0 && t - started > CFG.cycle * 1000) {
          fading = true
          canvas.classList.add('out')
          setTimeout(() => {
            load(pickWorld()); draw()
            canvas.classList.remove('out')
            started = performance.now(); acc = 0; fading = false
          }, 1300)
        }
      }
      requestAnimationFrame(frame)
    }
    requestAnimationFrame(frame)
  })
})()
</script>
</body>
</html>
