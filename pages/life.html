<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game of Life</title>
<!--
  Conway's Game of Life over the whole screen, in the colours of the theme.
  The field adapts to the screen: cell size follows the shorter side, the number
  of rows and columns follows the aspect ratio. The field is a torus.
  When the world stagnates, new life is sown over the old one.

  URL parameters (plus those of theme/theme.js: theme, font, duration, ...):
    cells=90        cells along the shorter side of the screen
    cell=12         cell size in CSS pixels instead (overrides cells)
    gps=10          generations per second
    density=0.2     share of living cells when sowing
    fade=8          generations a dead cell keeps glowing
-->
<link rel="stylesheet" href="theme/theme.css">
<script src="theme/theme.js"></script>
</head>
<body>
<div class="stage"><canvas id="c"></canvas></div>

<div class="overlay">
  <div class="caption plate rise">
    <div class="kicker">Cellular automaton</div>
    <h1 class="title">Game of Life</h1>
    <div class="sub">Rules B3/S23 · John Conway, 1970</div>
  </div>
  <div class="meta plate br rise" style="animation-delay: 250ms">
    <div><span class="label">Generation</span><span class="value" id="gen">0</span></div>
    <div><span class="label">Population</span><span class="value" id="pop">0</span></div>
  </div>
</div>

<script>
(() => {
  'use strict'

  const P = new URLSearchParams(location.search)
  const num = (k, d) => { const v = parseFloat(P.get(k)); return Number.isFinite(v) && v > 0 ? v : d }
  const CFG = {
    cells: num('cells', 90),
    cell: num('cell', 0),
    gps: num('gps', 10),
    density: Math.min(0.9, num('density', 0.2)),
    fade: Math.round(num('fade', 8)),
  }

  const canvas = document.getElementById('c')
  const ctx = canvas.getContext('2d')
  const genEl = document.getElementById('gen'), popEl = document.getElementById('pop')
  const fmt = new Intl.NumberFormat('en-US')

  let W, H, cs, cols, rows, ox, oy, alive, next, age, dead, gen, pop, popHist, colors

  // ---------- field ----------
  function layout() {
    const dpr = window.devicePixelRatio || 1
    W = innerWidth; H = innerHeight
    canvas.width = Math.round(W * dpr)
    canvas.height = Math.round(H * dpr)
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0)

    // the field fills the screen up to the theme's (small) field margin
    const margin = Theme.px('--field-margin')
    const aw = W - 2 * margin, ah = H - 2 * margin
    cs = CFG.cell || Math.max(3, Math.floor(Math.min(aw, ah) / CFG.cells))
    cols = Math.floor(aw / cs)
    rows = Math.floor(ah / cs)
    ox = Math.floor((W - cols * cs) / 2)
    oy = Math.floor((H - rows * cs) / 2)

    const n = cols * rows
    alive = new Uint8Array(n); next = new Uint8Array(n)
    age = new Uint8Array(n); dead = new Uint8Array(n)
    gen = 0; popHist = []
    sow()
  }

  // New random life; cells that die by it keep glowing like any other dead cell.
  function sow() {
    pop = 0
    for (let i = 0; i < alive.length; i++) {
      const is = Math.random() < CFG.density ? 1 : 0
      if (alive[i] && !is) dead[i] = 1
      if (is && !alive[i]) { age[i] = 0; dead[i] = 0 }
      alive[i] = is
      pop += is
    }
    gen = 0
    popHist = []
  }

  function step() {
    pop = 0
    for (let y = 0; y < rows; y++) {
      const up = ((y + rows - 1) % rows) * cols, row = y * cols, down = ((y + 1) % rows) * cols
      for (let x = 0; x < cols; x++) {
        const l = (x + cols - 1) % cols, r = (x + 1) % cols
        const n = alive[up + l] + alive[up + x] + alive[up + r] + alive[row + l] + alive[row + r] +
                  alive[down + l] + alive[down + x] + alive[down + r]
        const i = row + x, was = alive[i], is = n === 3 || (was && n === 2) ? 1 : 0
        next[i] = is
        if (is) { age[i] = was ? Math.min(255, age[i] + 1) : 0; dead[i] = 0; pop++ }
        else if (was) dead[i] = 1
        else if (dead[i]) dead[i] = dead[i] >= CFG.fade ? 0 : dead[i] + 1
      }
    }
    const t = alive; alive = next; next = t
    gen++

    // Stagnation: the population hardly changes any more (still lifes, blinkers and
    // a few gliders), or everything died. Then sow new life over the old.
    popHist.push(pop)
    if (popHist.length > 240) popHist.shift()
    if (pop === 0) sow()
    else if (popHist.length === 240) {
      let lo = Infinity, hi = 0, sum = 0
      for (const p of popHist) { lo = Math.min(lo, p); hi = Math.max(hi, p); sum += p }
      if (hi - lo <= Math.max(6, 0.02 * sum / popHist.length)) sow()
    }
  }

  // ---------- drawing ----------
  // Colours from the theme's palette, light to dark: newborn cells are the lightest,
  // they darken with age; dead cells glow on in the darker tones and fade out.
  function readColors() {
    const p = Theme.palette()
    const at = i => p[Math.min(i, p.length - 1)]
    colors = {
      born: at(0), young: at(1), grown: at(2), old: at(3),
      ghost: at(4), glow: Theme.color('--glow'),
    }
  }

  function cellPath(test) {
    const path = new Path2D(), s = cs - (cs >= 5 ? 1 : 0), r = cs >= 8 ? Math.max(1, cs * 0.18) : 0
    for (let i = 0; i < alive.length; i++) {
      if (!test(i)) continue
      const x = ox + (i % cols) * cs, y = oy + ((i / cols) | 0) * cs
      if (r) path.roundRect(x, y, s, s, r)
      else path.rect(x, y, s, s)
    }
    return path
  }

  function draw() {
    ctx.clearRect(0, 0, W, H)
    const c = colors
    for (let a = 1; a <= CFG.fade; a++) {
      ctx.fillStyle = Theme.rgba(c.ghost, 0.5 * (1 - (a - 1) / CFG.fade))
      ctx.fill(cellPath(i => dead[i] === a))
    }
    ctx.fillStyle = Theme.rgba(c.old)
    ctx.fill(cellPath(i => alive[i] && age[i] >= 6))
    ctx.fillStyle = Theme.rgba(c.grown)
    ctx.fill(cellPath(i => alive[i] && age[i] >= 2 && age[i] < 6))
    ctx.fillStyle = Theme.rgba(c.young)
    ctx.fill(cellPath(i => alive[i] && age[i] === 1))
    // newborn cells: white with a glow
    const born = cellPath(i => alive[i] && age[i] === 0)
    ctx.save()
    ctx.shadowColor = Theme.rgba(c.glow)
    ctx.shadowBlur = cs * 0.9
    ctx.fillStyle = Theme.rgba(c.born)
    ctx.fill(born)
    ctx.restore()

    genEl.textContent = fmt.format(gen)
    popEl.textContent = fmt.format(pop)
  }

  // ---------- run ----------
  Theme.ready.then(() => {
    readColors()
    layout()
    draw()
    addEventListener('resize', () => { layout(); draw() })

    // fixed generation rate, independent of the frame rate; no catching up after a stall
    let last = null, acc = 0
    function frame(t) {
      if (last !== null) acc += Math.min(t - last, 250)
      last = t
      const dt = 1000 / CFG.gps
      let stepped = false
      while (acc >= dt) { step(); acc -= dt; stepped = true }
      if (stepped) draw()
      requestAnimationFrame(frame)
    }
    requestAnimationFrame(frame)
  })
})()
</script>
</body>
</html>
