<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game of Life</title>
<script type="application/toml" id="deepsplay-page">
author      = "kratenko"
description = """
Conway's Game of Life over the whole screen, in the colours of the theme.
The field adapts to the screen: cell size follows the shorter side, the number
of rows and columns follows the aspect ratio. The field is a torus.
When the world stagnates, new life is sown over the old one.
"""
uses = ["theme"]

[params.cells]
type        = "int"
default     = 90
min         = 1
description = "Cells along the shorter side of the screen."

[params.cell]
type        = "int"
min         = 1
description = "Cell size in CSS pixels instead; overrides cells."

[params.gps]
type        = "number"
default     = 10
min         = 0.1
description = "Generations per second."

[params.density]
type        = "number"
default     = 0.2
min         = 0.01
max         = 0.9
description = "Share of living cells when sowing."

[params.fade]
type        = "int"
default     = 8
min         = 1
description = "Generations a dead cell keeps glowing."

[params.seed]
type        = "int"
min         = 1
description = "Fixed start, so runs can be compared; random without it."

[params.render]
type        = "enum"
values      = ["sprites", "paths"]
default     = "sprites"
description = "sprites: cells drawn from pre-rendered images, newborn cells as one path with their glow. paths: every state as one path (slower at 4K)."

[params.glowscale]
type        = "number"
default     = 0.25
min         = 0.01
max         = 1
description = "Resolution of the newborn glow per axis: 0.25 computes the blur on a quarter width and height and scales it up, which looks the same; 1 is full resolution (slower)."

[params.perf]
type        = "bool"
default     = false
description = "Show timings at the top right: step, draw (JS part), frame rate, worst frame."

[params.bench]
type        = "int"
default     = 0
min         = 0
description = "Measure instead of animating: run that many generations as fast as possible and print the result on the page."

[[variants]]
label = "Large cells, slow"
query = "cells=40&gps=4"

[[variants]]
label = "Fine and fast"
query = "cells=200&gps=30"

[[variants]]
label = "Reproducible start"
query = "seed=42"

[[variants]]
label = "Paths renderer with timings"
query = "render=paths&perf"
</script>
<script src="/lib/v1/deepsplay.js"></script>
<link rel="stylesheet" href="theme/theme.css">
<script src="theme/theme.js"></script>
</head>
<body>
<div class="stage"><canvas id="c"></canvas></div>

<div class="overlay">
  <div class="caption plate rise">
    <div class="kicker">Cellular automaton</div>
    <h1 class="title">Game of Life</h1>
    <div class="sub">Rules B3/S23 · John Conway, 1970</div>
  </div>
  <div class="meta plate br rise" style="animation-delay: 250ms">
    <div><span class="label">Generation</span><span class="value" id="gen">0</span></div>
    <div><span class="label">Population</span><span class="value" id="pop">0</span></div>
  </div>
</div>

<script>
(() => {
  'use strict'

  // Parameters as defined in the block at the top (deepsplay.js, ADR 14).
  const P = Deepsplay.params()
  const CFG = { ...P, seed: P.seed ?? null }

  // Random numbers: seeded (mulberry32) for comparable runs, else Math.random.
  const rand = CFG.seed === null ? Math.random : (() => {
    let a = CFG.seed >>> 0
    return () => {
      a = (a + 0x6D2B79F5) >>> 0
      let t = Math.imul(a ^ (a >>> 15), 1 | a)
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296
    }
  })()

  const canvas = document.getElementById('c')
  const ctx = canvas.getContext('2d')
  const genEl = document.getElementById('gen'), popEl = document.getElementById('pop')
  const fmt = new Intl.NumberFormat('en-US')

  let W, H, dpr, cs, cols, rows, ox, oy, alive, next, age, dead, gen, pop, popHist, colors, sprites

  // ---------- field ----------
  function layout() {
    dpr = window.devicePixelRatio || 1
    W = innerWidth; H = innerHeight
    canvas.width = Math.round(W * dpr)
    canvas.height = Math.round(H * dpr)
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0)

    // the field fills the screen up to the theme's (small) field margin
    const margin = Theme.px('--field-margin')
    const aw = W - 2 * margin, ah = H - 2 * margin
    cs = CFG.cell || Math.max(3, Math.floor(Math.min(aw, ah) / CFG.cells))
    cols = Math.floor(aw / cs)
    rows = Math.floor(ah / cs)
    ox = Math.floor((W - cols * cs) / 2)
    oy = Math.floor((H - rows * cs) / 2)

    const n = cols * rows
    alive = new Uint8Array(n); next = new Uint8Array(n)
    age = new Uint8Array(n); dead = new Uint8Array(n)
    gen = 0; popHist = []
    if (CFG.render === 'sprites') buildSprites()
    sow()
  }

  // New random life; cells that die by it keep glowing like any other dead cell.
  function sow() {
    pop = 0
    for (let i = 0; i < alive.length; i++) {
      const is = rand() < CFG.density ? 1 : 0
      if (alive[i] && !is) dead[i] = 1
      if (is && !alive[i]) { age[i] = 0; dead[i] = 0 }
      alive[i] = is
      pop += is
    }
    gen = 0
    popHist = []
  }

  function step() {
    pop = 0
    for (let y = 0; y < rows; y++) {
      const up = ((y + rows - 1) % rows) * cols, row = y * cols, down = ((y + 1) % rows) * cols
      for (let x = 0; x < cols; x++) {
        const l = (x + cols - 1) % cols, r = (x + 1) % cols
        const n = alive[up + l] + alive[up + x] + alive[up + r] + alive[row + l] + alive[row + r] +
                  alive[down + l] + alive[down + x] + alive[down + r]
        const i = row + x, was = alive[i], is = n === 3 || (was && n === 2) ? 1 : 0
        next[i] = is
        if (is) { age[i] = was ? Math.min(255, age[i] + 1) : 0; dead[i] = 0; pop++ }
        else if (was) dead[i] = 1
        else if (dead[i]) dead[i] = dead[i] >= CFG.fade ? 0 : dead[i] + 1
      }
    }
    const t = alive; alive = next; next = t
    gen++

    // Stagnation: the population hardly changes any more (still lifes, blinkers and
    // a few gliders), or everything died. Then sow new life over the old.
    popHist.push(pop)
    if (popHist.length > 240) popHist.shift()
    if (pop === 0) sow()
    else if (popHist.length === 240) {
      let lo = Infinity, hi = 0, sum = 0
      for (const p of popHist) { lo = Math.min(lo, p); hi = Math.max(hi, p); sum += p }
      if (hi - lo <= Math.max(6, 0.02 * sum / popHist.length)) sow()
    }
  }

  // ---------- drawing ----------
  // Colours from the theme's palette, light to dark: newborn cells are the lightest,
  // they darken with age; dead cells glow on in the darker tones and fade out.
  function readColors() {
    const p = Theme.palette()
    const at = i => p[Math.min(i, p.length - 1)]
    colors = {
      born: at(0), young: at(1), grown: at(2), old: at(3),
      ghost: at(4), glow: Theme.color('--glow'),
    }
  }

  function cellPath(test) {
    const path = new Path2D(), s = cs - (cs >= 5 ? 1 : 0), r = cs >= 8 ? Math.max(1, cs * 0.18) : 0
    for (let i = 0; i < alive.length; i++) {
      if (!test(i)) continue
      const x = ox + (i % cols) * cs, y = oy + ((i / cols) | 0) * cs
      if (r) path.roundRect(x, y, s, s, r)
      else path.rect(x, y, s, s)
    }
    return path
  }

  // Sprites: one pre-rendered image per state (fade steps of dead cells, young, grown, old),
  // in device pixels, drawn at whole device pixels.
  function buildSprites() {
    const s = cs - (cs >= 5 ? 1 : 0), r = cs >= 8 ? Math.max(1, cs * 0.18) : 0
    const size = Math.ceil(s * dpr)
    const make = fill => {
      const c = document.createElement('canvas')
      c.width = c.height = size
      const g = c.getContext('2d')
      g.setTransform(dpr, 0, 0, dpr, 0, 0)
      g.fillStyle = fill
      g.beginPath()
      if (r) g.roundRect(0, 0, s, s, r)
      else g.rect(0, 0, s, s)
      g.fill()
      return c
    }
    const c = colors
    sprites = { ghost: [null], young: make(Theme.rgba(c.young)), grown: make(Theme.rgba(c.grown)), old: make(Theme.rgba(c.old)) }
    for (let a = 1; a <= CFG.fade; a++) sprites.ghost.push(make(Theme.rgba(c.ghost, 0.5 * (1 - (a - 1) / CFG.fade))))
  }

  // All cells except the newborn ones.
  function drawCells() {
    const c = colors
    if (CFG.render === 'sprites') {
      ctx.setTransform(1, 0, 0, 1, 0, 0)
      const sp = sprites
      for (let i = 0; i < alive.length; i++) {
        let img
        if (alive[i]) {
          const a = age[i]
          if (a === 0) continue
          img = a >= 6 ? sp.old : a >= 2 ? sp.grown : sp.young
        } else if (dead[i]) img = sp.ghost[dead[i]]
        else continue
        ctx.drawImage(img, Math.round((ox + (i % cols) * cs) * dpr), Math.round((oy + ((i / cols) | 0) * cs) * dpr))
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
      return
    }
    for (let a = 1; a <= CFG.fade; a++) {
      ctx.fillStyle = Theme.rgba(c.ghost, 0.5 * (1 - (a - 1) / CFG.fade))
      ctx.fill(cellPath(i => dead[i] === a))
    }
    ctx.fillStyle = Theme.rgba(c.old)
    ctx.fill(cellPath(i => alive[i] && age[i] >= 6))
    ctx.fillStyle = Theme.rgba(c.grown)
    ctx.fill(cellPath(i => alive[i] && age[i] >= 2 && age[i] < 6))
    ctx.fillStyle = Theme.rgba(c.young)
    ctx.fill(cellPath(i => alive[i] && age[i] === 1))
  }

  // Newborn cells: white with a glow, as one path, so the glow is one shared shadow.
  // With glowscale < 1 only the shadow is computed on a smaller canvas and scaled up;
  // the cells themselves are filled sharp on top.
  let glowCanvas = null
  function drawBorn() {
    const born = cellPath(i => alive[i] && age[i] === 0)
    const k = CFG.glowscale
    if (k < 1) {
      const gw = Math.ceil(canvas.width * k), gh = Math.ceil(canvas.height * k)
      if (!glowCanvas) glowCanvas = document.createElement('canvas')
      if (glowCanvas.width !== gw || glowCanvas.height !== gh) { glowCanvas.width = gw; glowCanvas.height = gh }
      const g = glowCanvas.getContext('2d')
      g.setTransform(1, 0, 0, 1, 0, 0)
      g.clearRect(0, 0, gw, gh)
      // shadow only: draw the cells far off the canvas and offset their shadow back into it
      const off = W + cs * 10
      g.setTransform(dpr * k, 0, 0, dpr * k, -off * dpr * k, 0)
      g.shadowColor = Theme.rgba(colors.glow)
      g.shadowBlur = cs * 0.9 * k
      g.shadowOffsetX = off * dpr * k
      g.fillStyle = '#fff'
      g.fill(born)
      ctx.drawImage(glowCanvas, 0, 0, W, H)
      ctx.fillStyle = Theme.rgba(colors.born)
      ctx.fill(born)
      return
    }
    ctx.save()
    ctx.shadowColor = Theme.rgba(colors.glow)
    ctx.shadowBlur = cs * 0.9
    ctx.fillStyle = Theme.rgba(colors.born)
    ctx.fill(born)
    ctx.restore()
  }

  function draw() {
    ctx.clearRect(0, 0, W, H)
    drawCells()
    drawBorn()
    genEl.textContent = fmt.format(gen)
    popEl.textContent = fmt.format(pop)
  }

  // ---------- measuring ----------
  // Reading one pixel forces the canvas to finish all drawing so far, so the time of a
  // part includes the actual painting, not only recording the commands.
  const flush = () => ctx.getImageData(0, 0, 1, 1)
  const stats = list => {
    const a = [...list].sort((x, y) => x - y), avg = a.reduce((s, v) => s + v, 0) / a.length
    return { avg: +avg.toFixed(2), p95: +a[Math.floor(0.95 * (a.length - 1))].toFixed(2), max: +a[a.length - 1].toFixed(2) }
  }

  function bench() {
    const out = { render: CFG.render, glowscale: CFG.glowscale, seed: CFG.seed, screen: `${W}x${H}@${dpr}`, cell: cs, grid: `${cols}x${rows}`, generations: CFG.bench }
    const t = { step: [], clear: [], cells: [], born: [], total: [] }
    for (let k = 0; k < 20; k++) { step(); draw(); flush() }
    for (let k = 0; k < CFG.bench; k++) {
      let t0 = performance.now(); step(); const t1 = performance.now()
      ctx.clearRect(0, 0, W, H); flush(); const t2 = performance.now()
      drawCells(); flush(); const t3 = performance.now()
      drawBorn(); flush(); const t4 = performance.now()
      t.step.push(t1 - t0); t.clear.push(t2 - t1); t.cells.push(t3 - t2); t.born.push(t4 - t3); t.total.push(t4 - t0)
    }
    for (const k in t) out[k] = stats(t[k])
    const pre = document.createElement('pre')
    pre.id = 'bench'
    pre.style.cssText = 'position:fixed;left:2vmin;top:2vmin;margin:0;padding:1vmin;background:#000c;color:#fff;font:14px monospace;z-index:9'
    pre.textContent = JSON.stringify(out, null, 1)
    document.body.appendChild(pre)
    console.log('BENCH ' + JSON.stringify(out))
  }

  // Live readout for ?perf: step and draw time (JS part, the painting itself happens later),
  // frame rate and worst frame interval over the last 2 seconds.
  let perfEl = null
  const perf = { step: [], draw: [], frames: [] }
  function perfShow(now) {
    perf.frames.push(now)
    while (perf.frames.length && now - perf.frames[0] > 2000) perf.frames.shift()
    for (const k of ['step', 'draw']) if (perf[k].length > 60) perf[k].splice(0, perf[k].length - 60)
    if (!perfEl || !perf.draw.length) return
    let worst = 0
    for (let i = 1; i < perf.frames.length; i++) worst = Math.max(worst, perf.frames[i] - perf.frames[i - 1])
    const fps = perf.frames.length > 1 ? (perf.frames.length - 1) / ((now - perf.frames[0]) / 1000) : 0
    const s = stats(perf.step), d = stats(perf.draw)
    perfEl.textContent = `${CFG.render} · glow ${CFG.glowscale} · ${cols}x${rows} · cell ${cs}px\n` +
      `step ${s.avg} ms (max ${s.max})\ndraw ${d.avg} ms (max ${d.max})\n` +
      `${fps.toFixed(0)} fps · worst frame ${worst.toFixed(0)} ms`
  }

  // ---------- run ----------
  Theme.ready.then(() => {
    readColors()
    layout()
    if (CFG.bench) { bench(); return }
    draw()
    addEventListener('resize', () => { layout(); draw() })
    if (CFG.perf) {
      perfEl = document.createElement('pre')
      perfEl.style.cssText = 'position:fixed;right:var(--margin);top:var(--margin);margin:0;padding:1vmin 1.4vmin;' +
        'background:var(--surface);color:var(--ink);font:1.6vmin/1.4 var(--font-mono);border-radius:var(--radius);z-index:9'
      document.body.appendChild(perfEl)
    }

    // fixed generation rate, independent of the frame rate; no catching up after a stall
    let last = null, acc = 0
    function frame(t) {
      if (last !== null) acc += Math.min(t - last, 250)
      last = t
      const dt = 1000 / CFG.gps
      let stepped = false
      while (acc >= dt) {
        const t0 = performance.now(); step(); acc -= dt; stepped = true
        if (CFG.perf) perf.step.push(performance.now() - t0)
      }
      if (stepped) {
        const t0 = performance.now(); draw()
        if (CFG.perf) perf.draw.push(performance.now() - t0)
      }
      if (CFG.perf) perfShow(t)
      requestAnimationFrame(frame)
    }
    requestAnimationFrame(frame)
  })
})()
</script>
</body>
</html>
