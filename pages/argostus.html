<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Argostus</title>
<link rel="stylesheet" href="theme/theme.css">
<script type="application/toml" id="deepsplay-page">
description = "An eye that opens out of nothing, looks around, and closes into nothing again."
details     = """
A relative of argos.html: the same eye, but without a face. The page starts empty; the eye
opens as if from a blink, only the lids have the colour of the background, so it seems to
open out of nothing. It looks around for a while, closes again and is gone, then the next
opening begins, with an iris colour from the whole spectrum.

The eye is a ball after a schematic eye: iris and pupil turn with it, and the reflection of
a light sits on the curved cornea, lagging behind the pupil as on a real eye (sources in
the code).
"""
author      = "kratenko"
uses = ["theme"]

[params.speed]
type        = "number"
default     = 1
min         = 0.1
max         = 10
description = "Factor on the speed of everything."

[params.vessels]
type        = "number"
default     = 0.5
min         = 0
max         = 1
description = "Blood vessels in the white of the eye: 0 none, 1 a bloodshot eye."

[params.size]
type        = "number"
default     = 0.6
min         = 0.1
max         = 1
description = "Width of the eye as a share of the screen width (limited by the height)."
</script>
<script src="/lib/v1/deepsplay.js"></script>
<script src="theme/theme.js"></script>
</head>
<body>
<div class="stage"><canvas id="c"></canvas></div>

<script>
(() => {
  'use strict'
  const P = Deepsplay.params()
  const canvas = document.getElementById('c')
  const ctx = canvas.getContext('2d')

  // ---------- the eye, in argos' units: 16 wide, 11 high ----------
  const EW = 16, EH = 11
  const LEFT = [0.6, 5.5], RIGHT = [15.4, 5.5]     // corners of the eye
  const TOP_C = 0.17, BOTTOM_C = 10.83              // control points of the open lids
  const SHUT_C = 7.6                                // where both lids meet when closed
  const IRIS = [8, 5], IRIS_R = 3.9, PUPIL_R = 1.9
  // A schematic eye (Gullstrand / Le Grand) in drawing units, the iris (6 mm radius) being
  // IRIS_R: centre of rotation 13.5 mm behind the front of the cornea, cornea radius 7.8 mm,
  // so its centre 5.7 mm before the centre of rotation; pupil ~3 mm behind the front; the
  // cornea ends at the limbus, ~6 mm off its axis; the white of the eye has radius ~12 mm.
  // With these, the reflection of a light next to the viewer moves 0.08 mm per degree
  // against the pupil: 12°/mm, the measured Hirschberg ratio.
  // Sources (looked up 2026-11-12):
  // - spherical cornea as a mirror, reflection where the surface faces halfway between light
  //   and camera, cornea centre on the eye's axis (gaze tracking):
  //   https://proceedings.cmbes.ca/index.php/proceedings/article/download/600/593/1195
  //   https://patentsgazette.uspto.gov/week24/OG/html/1535-3/US12329456-20250617.html
  // - Hirschberg ratio, measured ~12-13°/mm (older clinical value 7-8°/mm):
  //   https://forschung.kssg.ch/en/publikationen/4109-fixation-free-assessment-of-the-hirschberg-ratio
  //   https://www.jstage.jst.go.jp/article/jorthoptic/38/0/38_0_203/_article
  //   https://aao.org/image/hirschberg-corneal-reflex-test-2
  // - schematic eye dimensions (Gullstrand / Le Grand): textbook values, not looked up.
  const MM = IRIS_R / 6
  const EYE = { pupil: 10.5 * MM, cornea: 5.7 * MM, corneaR: 7.8 * MM, scleraR: 12 * MM,
    capAngle: Math.asin(6 / 7.8) }
  // The light: above and to the right of the viewer. HALF is halfway between the directions to
  // the light and to the viewer (both far away); a straight-looking eye shows the reflection
  // at corneaR * HALF from the cornea's centre.
  const LIGHT = [0.48, -0.48, 0.73]
  const HALF = (() => { const v = [LIGHT[0], LIGHT[1], LIGHT[2] + 1], n = Math.hypot(...v); return v.map(c => c / n) })()
  const RIM = '#755f43', RIM_SOFT = '#271f16', WHITE = '#d8d8d8'
  // An iris colour from the whole spectrum, with a dark pupil of the same hue, in the
  // brightness of argos' four colours.
  const irisColours = () => {
    const h = Math.random() * 360, sat = 80 + Math.random() * 20
    return { a: `hsl(${h.toFixed(0)} ${sat.toFixed(0)}% ${(36 + Math.random() * 10).toFixed(0)}%)`,
      o: `hsl(${h.toFixed(0)} ${sat.toFixed(0)}% 12%)` }
  }

  // Blood vessels: from the corners of the eye towards the iris, thinning and branching, a
  // little wavy. Each is a list of points with a width; positions on the white of the eye.
  const VESSEL_SHIFT = 0.6          // vessels move with the eye, a bit less than the iris
  function makeVessels(amount) {
    const out = []
    if (amount <= 0) return out
    // the fully open eye, to find where the white ends
    const open = new Path2D()
    open.moveTo(...LEFT); curve(open, TOP_C); curve(open, BOTTOM_C, true); open.closePath()
    const probe = document.createElement('canvas').getContext('2d')
    const inside = (x, y) => probe.isPointInPath(open, x, y)
    const limbus = IRIS_R + 0.35                       // vessels fade out before the iris
    const SHIFT = Math.hypot(3, 2) * VESSEL_SHIFT        // farthest the eye moves them
    const grow = (x, y, angle, width, length, depth) => {
      const pts = [[x, y, width]]
      const step = 0.3, n = Math.max(3, Math.round(length / step))
      for (let i = 1; i <= n; i++) {
        // wander, with a slight pull towards the iris
        const home = Math.atan2(IRIS[1] - y, IRIS[0] - x)
        let d = home - angle; d = Math.atan2(Math.sin(d), Math.cos(d))
        angle += (Math.random() - 0.5) * 0.7 + d * 0.08
        x += Math.cos(angle) * step; y += Math.sin(angle) * step
        if (Math.hypot(x - IRIS[0], y - IRIS[1]) < limbus) break
        const w = width * (1 - i / (n + 1))
        pts.push([x, y, w])
        if (depth < 2 && i > 2 && Math.random() < 0.16)
          grow(x, y, angle + (Math.random() < 0.5 ? -1 : 1) * (0.5 + Math.random() * 0.6), w * 0.7,
            (n - i) * step * (0.4 + Math.random() * 0.4), depth + 1)
      }
      if (pts.length > 1) out.push(pts)
    }
    const count = Math.round(3 + amount * 9)
    for (let i = 0; i < count; i++) {
      // a direction from the iris: mostly towards the corners, some up or down under the lids
      const side = i % 2 === 0 ? Math.PI : 0
      const a = side + (Math.random() - 0.5) * (Math.random() < 0.7 ? 1.0 : 2.4)
      // walk out from the iris until past the edge of the white, then a bit further: the
      // vessel comes out from under the lids, its start hidden in the socket
      // vessel comes out from under the lids, its start hidden in the socket; far enough out
      // that it stays hidden when the eye turns all the way (they move by up to SHIFT)
      let edge = limbus
      while (edge < 12 && inside(IRIS[0] + Math.cos(a) * edge, IRIS[1] + Math.sin(a) * edge)) edge += 0.1
      const r = edge + SHIFT + 0.4 + Math.random() * 0.6
      const x = IRIS[0] + Math.cos(a) * r, y = IRIS[1] + Math.sin(a) * r
      // towards the iris, but not all the way: most end on the white
      const length = (r - edge) + (edge - limbus) * (0.55 + Math.random() * 0.5)
      grow(x, y, a + Math.PI + (Math.random() - 0.5) * 0.5, 0.13 + Math.random() * 0.1 * (0.5 + amount), length, 0)
    }
    return out
  }


  // Curve between the corners whose control points sit at height c.
  const curve = (path, c, reverse) => {
    const [a, b] = reverse ? [RIGHT, LEFT] : [LEFT, RIGHT]
    path.bezierCurveTo(a[0] + (b[0] - a[0]) * 0.2, c, a[0] + (b[0] - a[0]) * 0.8, c, b[0], b[1])
  }

  // ---------- behaviour ----------
  // blank → opening → open (glances) → closing → blank …, times in seconds
  const rnd = (a, b) => a + Math.random() * (b - a)
  const ease = u => u * u * (3 - 2 * u)
  const eye = { phase: 'blank', t: 0, len: 1.2, look: [0, 0], from: [0, 0], to: [0, 0], moveT: 1, next: 1, colours: null }

  function enter(phase) {
    eye.phase = phase; eye.t = 0
    if (phase === 'blank') eye.len = rnd(1.0, 2.5)
    if (phase === 'opening') {
      eye.len = rnd(0.45, 0.8)
      eye.colours = irisColours()
      eye.vessels = makeVessels(P.vessels)
      eye.look = eye.from = eye.to = [rnd(-2, 2), rnd(-1, 1)]
    }
    if (phase === 'open') { eye.len = rnd(3, 7); eye.next = rnd(0.6, 1.6) }
    if (phase === 'closing') eye.len = rnd(0.35, 0.6)
  }

  function update(dt) {
    eye.t += dt
    if (eye.phase === 'open') {
      // glance now and then, with a quick movement
      eye.moveT += dt
      if (eye.t >= eye.next) {
        eye.from = eye.look; eye.to = [rnd(-3, 3), rnd(-2, 2)]; eye.moveT = 0
        eye.next = eye.t + rnd(0.8, 2.2)
      }
      const k = 1 - (1 - Math.min(1, eye.moveT / 0.1)) ** 3
      eye.look = [eye.from[0] + (eye.to[0] - eye.from[0]) * k, eye.from[1] + (eye.to[1] - eye.from[1]) * k]
    }
    if (eye.t >= eye.len) enter({ blank: 'opening', opening: 'open', open: 'closing', closing: 'blank' }[eye.phase])
  }

  // 0 shut (invisible) .. 1 open
  function openness() {
    const u = Math.min(1, eye.t / eye.len)
    if (eye.phase === 'opening') return ease(u)
    if (eye.phase === 'open') return 1
    if (eye.phase === 'closing') return 1 - u * u
    return 0
  }

  // ---------- drawing ----------
  function drawEye() {
    const o = openness()
    if (o <= 0) return
    // the lids part from the line where they meet; both lids are the background
    const top = SHUT_C + (TOP_C - SHUT_C) * o, bottom = SHUT_C + (BOTTOM_C - SHUT_C) * o
    const slit = new Path2D()
    slit.moveTo(...LEFT); curve(slit, top); curve(slit, bottom, true); slit.closePath()
    const [dx, dy] = eye.look, colours = eye.colours

    // the rim first, the eye over it: only the rim's outer half shows, the slit stays clear;
    // it grows with the opening, so a closed eye leaves nothing behind
    const w = Math.min(1, o * 3)
    ctx.lineJoin = 'round'
    ctx.strokeStyle = RIM_SOFT; ctx.lineWidth = 2.2 * w; ctx.stroke(slit)
    ctx.strokeStyle = RIM; ctx.lineWidth = 1.2 * w; ctx.stroke(slit)

    ctx.save()
    ctx.clip(slit)
    ctx.fillStyle = WHITE
    ctx.fillRect(0, 0, EW, EH)
    // the vessels sit on the white of the ball and turn with it, a little less than the iris
    if (eye.vessels && eye.vessels.length) {
      ctx.save()
      ctx.translate(dx * VESSEL_SHIFT, dy * VESSEL_SHIFT)
      ctx.lineCap = 'round'; ctx.lineJoin = 'round'
      // red mixed into the white beforehand: overlapping segments must not darken
      const k = 0.45 + 0.4 * P.vessels, mix = (r, w) => Math.round(w + (r - w) * k)
      ctx.strokeStyle = `rgb(${mix(168, 216)}, ${mix(28, 216)}, ${mix(32, 216)})`
      for (const pts of eye.vessels) for (let i = 1; i < pts.length; i++) {
        ctx.lineWidth = pts[i - 1][2]
        ctx.beginPath(); ctx.moveTo(pts[i - 1][0], pts[i - 1][1]); ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke()
      }
      ctx.restore()
    }
    // the eye as a ball turned by the gaze g (unit vector, z towards the viewer)
    const gx = dx / EYE.pupil, gy = dy / EYE.pupil, gz = Math.sqrt(Math.max(0, 1 - gx * gx - gy * gy))
    // iris and pupil are discs facing g: seen from the front they are ellipses, shortened
    // by gz along the direction the eye turns to
    const turn = Math.atan2(gy, gx)
    const disc = (r, colour) => {
      ctx.fillStyle = colour
      ctx.beginPath(); ctx.ellipse(IRIS[0] + dx, IRIS[1] + dy, Math.max(0.01, r * gz), r, turn, 0, 2 * Math.PI); ctx.fill()
    }
    disc(IRIS_R, colours.a)
    disc(PUPIL_R, colours.o)
    // The reflection of the light on the cornea (a mirror sphere): it sits where the surface
    // faces halfway between light and viewer, HALF. Its centre moves with the eye, but the
    // reflection only moves with that centre, which is nearer the centre of rotation than
    // the pupil, so it lags behind the pupil (Hirschberg ratio ~12°/mm).
    let rx = IRIS[0] + EYE.cornea * gx + EYE.corneaR * HALF[0], ry = IRIS[1] + EYE.cornea * gy + EYE.corneaR * HALF[1]
    // past the edge of the cornea it is the white of the eye that reflects, a larger sphere
    // around the centre of rotation
    if (gx * HALF[0] + gy * HALF[1] + gz * HALF[2] < Math.cos(EYE.capAngle)) {
      rx = IRIS[0] + EYE.scleraR * HALF[0]; ry = IRIS[1] + EYE.scleraR * HALF[1]
    }
    ctx.fillStyle = 'rgba(255,255,255,0.55)'
    ctx.beginPath(); ctx.arc(rx, ry, 0.55, 0, 2 * Math.PI); ctx.fill()
    ctx.restore()
  }

  let W, H, dpr, cell
  function layout() {
    dpr = window.devicePixelRatio || 1
    W = innerWidth; H = innerHeight
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr)
    const s = Math.min(W * P.size / EW, H * 0.8 / EH)
    cell = { x: (W - EW * s) / 2, y: (H - EH * s) / 2, s }
  }

  Theme.ready.then(() => {
    layout()
    addEventListener('resize', layout)
    enter('blank')
    let last = null
    function frame(now) {
      const dt = last === null ? 0 : Math.min(0.1, (now - last) / 1000)
      last = now
      update(dt * P.speed)
      ctx.setTransform(1, 0, 0, 1, 0, 0)
      ctx.clearRect(0, 0, canvas.width, canvas.height)
      ctx.setTransform(cell.s * dpr, 0, 0, cell.s * dpr, cell.x * dpr, cell.y * dpr)
      drawEye()
      requestAnimationFrame(frame)
    }
    requestAnimationFrame(frame)
  })
})()
</script>
</body>
</html>
